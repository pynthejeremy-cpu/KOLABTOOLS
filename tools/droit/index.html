<html lang="fr">
<head>

<style>
/* Layout : barre d'onglets en haut, une colonne de travail ; le contrat se lit comme un acte (papier, filet, sceau). */
:root{
  --paper:#f4f5f7; --sheet:#ffffff; --ink:#151a2d; --muted:#5b6275; --line:#dfe2ea;
  --accent:#2a3fb8; --accent-ink:#ffffff; --seal:#9b1c31;
  --ok:#1f7a4d; --ok-bg:#e3f3ea; --warn:#9a5b00; --warn-bg:#fbefd9; --bad:#a3202f; --bad-bg:#f9e3e5; --idle-bg:#eceef3;
  --display:"Newsreader",Georgia,"Times New Roman",serif; --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#10131c; --sheet:#181c28; --ink:#e8eaf2; --muted:#9aa1b5; --line:#2a3042;
  --accent:#8c9cff; --accent-ink:#0e1220; --seal:#e0687b;
  --ok:#6fd3a0; --ok-bg:#163326; --warn:#f0bb5e; --warn-bg:#3a2c12; --bad:#ff8a96; --bad-bg:#3b1820; --idle-bg:#232838; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#10131c; --sheet:#181c28; --ink:#e8eaf2; --muted:#9aa1b5; --line:#2a3042;
  --accent:#8c9cff; --accent-ink:#0e1220; --seal:#e0687b;
  --ok:#6fd3a0; --ok-bg:#163326; --warn:#f0bb5e; --warn-bg:#3a2c12; --bad:#ff8a96; --bad-bg:#3b1820; --idle-bg:#232838; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--body)}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0}
h1{font-size:26px} h2{font-size:21px} h3{font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:14px max(16px,4vw);border-bottom:1px solid var(--line);background:var(--sheet)}
.brand{display:flex;gap:10px;align-items:center}
.seal{width:30px;height:30px;border-radius:50%;border:2px solid var(--seal);display:grid;place-items:center;color:var(--seal);font:600 13px var(--display)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
nav button[aria-current="page"]{background:var(--idle-bg);color:var(--ink)}
main{max-width:980px;margin:0 auto;padding:24px max(16px,4vw) 64px;display:grid;gap:20px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--sheet);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
label.f{display:grid;gap:5px;font-size:13px;font-weight:500;color:var(--muted)}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 10px;color:var(--ink);font-size:15px;font-weight:400}
textarea{resize:vertical;min-height:70px}
fieldset{border:1px solid var(--line);border-radius:10px;padding:14px;margin:0;display:grid;gap:12px}
legend{padding:0 6px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px}
.chk input{margin:0}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.idle{background:var(--idle-bg);color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
th button{all:unset;cursor:pointer} th button:focus-visible{outline:2px solid var(--accent)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer} tr.click:hover td{background:var(--paper)}
.tablewrap{overflow-x:auto}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px}
.deed{border-left:3px solid var(--seal);padding-left:16px;display:grid;gap:8px;max-width:68ch}
.deed p{margin:0}
.parties{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.party{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px}
.party .role{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.party img{max-width:100%;height:56px;object-fit:contain;background:#fff;border-radius:6px}
canvas.pad{width:100%;height:150px;border:1px dashed var(--muted);border-radius:8px;background:#fff;touch-action:none;cursor:crosshair}
.search{position:relative}
.hits{position:absolute;z-index:5;left:0;right:0;top:100%;background:var(--sheet);border:1px solid var(--line);border-radius:8px;margin-top:4px;max-height:220px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.hits button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;cursor:pointer}
.hits button:hover,.hits button:focus{background:var(--paper)}
.picked{display:flex;gap:8px;align-items:center;font-weight:500}
.banner{border:1px solid var(--line);border-left:3px solid var(--warn);background:var(--sheet);border-radius:10px;padding:12px 14px;font-size:14px}
.err{color:var(--bad);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font:600 26px var(--display)}
ul.plain{margin:0;padding-left:18px;display:grid;gap:6px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--sheet);color:var(--ink);max-width:560px;width:calc(100% - 32px);padding:20px}
dialog::backdrop{background:rgba(10,12,20,.45)}
/* ---------- Apparence et Back-office ---------- */
.ap-h{margin:18px 0 8px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ap-h:first-of-type{margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:5px;align-items:flex-start;text-align:left;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);cursor:pointer}
.tile i{display:block;width:100%;height:34px;border-radius:6px;border:1px solid rgba(128,128,128,.35)}
.tile b{font-weight:600;font-size:13.5px}.tile small{font-size:11.5px;color:var(--muted)}
.tile[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.tile:disabled{cursor:not-allowed;opacity:.55}
.tile:disabled[aria-pressed="true"]{opacity:1}
.pals{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pal{display:flex;padding:3px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);cursor:pointer}
.pal i{display:block;width:17px;height:17px}
.cps{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}.cps label{display:flex;align-items:center;gap:6px;font-size:13px}
.cps input{width:38px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.rng{display:grid;grid-template-columns:150px 1fr 56px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.rng input{width:100%;accent-color:var(--accent)}.rng b{text-align:right;font-variant-numeric:tabular-nums}
details.fine{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
details.fine summary{cursor:pointer;font-weight:600;min-height:36px;display:flex;align-items:center}
.lock{border-left:3px solid var(--accent);padding:8px 12px;border-radius:8px;background:var(--idle-bg);font-size:13.5px}
.feat{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.feat .d{grid-column:2;font-size:13px;color:var(--muted)}
.switch{position:relative;display:inline-flex;align-items:center;cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .tr{width:46px;height:28px;border-radius:999px;background:var(--idle-bg);border:1px solid var(--line);position:relative;flex:none}
.switch .tr i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:left .15s}
.switch input:checked+.tr{background:var(--accent);border-color:var(--accent)}
.switch input:checked+.tr i{left:21px}
.switch input:focus-visible+.tr{outline:2px solid var(--accent);outline-offset:2px}
.radio{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.radio input{margin-top:3px;accent-color:var(--accent)}
.radio b{display:block}
@media (max-width:560px){.rng{grid-template-columns:1fr 56px}.rng span{grid-column:1/-1}}
.grid2{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
label.f{min-width:0}label.f select,label.f input{min-width:0;width:100%;max-width:100%}
.bo-tabs{display:flex;flex-wrap:wrap;gap:6px}
.bo-tabs button{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer}
.bo-tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.badge-n{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font:600 12px var(--body);vertical-align:2px}
.accrow{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px}
.accrow .e{font-size:13px;color:var(--muted);word-break:break-all}
.acc-wrap{overflow-x:auto}
.acc-list{min-width:720px;display:flex;flex-direction:column}
.acc-row{display:grid;grid-template-columns:minmax(170px,1.6fr) 150px repeat(6,62px) auto;gap:6px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.acc-row.head{border-top:0;font-size:11.5px;color:var(--muted);font-weight:600}
.acc-h{text-align:center;line-height:1.15}
.acc-who b{display:block;font-size:14px}.acc-who em{font-style:normal;font-size:12px;color:var(--muted);display:block;word-break:break-all}
.acc-row select{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 8px;color:var(--ink);font-size:13px;width:100%}
.acc-c{display:flex;justify-content:center;align-items:center;gap:8px}
.acc-c input{width:20px;height:20px;accent-color:var(--accent)}
.acc-mods{display:contents}.acc-l{display:none}
.acc-a{display:flex;gap:4px;flex-wrap:wrap}
.mini{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:5px 8px;font-size:12px;font-weight:600;cursor:pointer}
@media (max-width:760px){
  .acc-wrap{overflow:visible}.acc-list{min-width:0}.acc-row.head{display:none}
  .acc-row{display:block;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .acc-who{margin-bottom:8px}.acc-row select{margin-bottom:10px}
  .acc-mods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 12px}
  .acc-c{justify-content:flex-start}.acc-l{display:block;font-style:normal;font-size:13px}
  .acc-a{margin-top:10px}
}

:root[data-da]{--paper:var(--da-fond)!important;--ink:var(--da-texte)!important;--accent:var(--da-accent)!important;--seal:var(--da-accent)!important;--accent-ink:var(--da-on,#fff)!important;

  --idle-bg:color-mix(in srgb,var(--da-texte) 9%,var(--da-fond))!important;--display:var(--da-titre)!important;--body:var(--da-corps)!important}

  --da-decor:linear-gradient(color-mix(in srgb,var(--da-texte) 7%,transparent) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,color-mix(in srgb,var(--da-texte) 7%,transparent) 1px,transparent 1px) 0 0/28px 28px,radial-gradient(ellipse at 80% 0,color-mix(in srgb,var(--da-texte) 16%,var(--da-fond)),var(--da-fond) 60%)}

  --da-decor:radial-gradient(circle at 12% 6%,#ffd9ec 0,transparent 36%),radial-gradient(circle at 88% 12%,#cfe4ff 0,transparent 40%),radial-gradient(circle at 60% 100%,#d9d2ff 0,transparent 50%),var(--da-fond)}

:root[data-da="braun"]{--da-titre:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;--da-corps:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;--da-card:color-mix(in srgb,var(--da-fond) 55%,#fff);--da-rayon:8px;--da-rayon-btn:6px;--da-ombre:0 1px 0 #fff inset,0 10px 20px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.18)}

/* ---------- système design Fil Rouge (10 styles) ---------- */
const FR_T={cockpit:["Cockpit","Futuriste","06080f,cfe3ff,ff6a2b"],spatial:["Spatial","Futuriste","eeecf8,1b1b2a,5b4bff",1],

const HEX6=/^[0-9a-f]{6}$/i;
const FR_IMG=(()=>{const W=1600,H=1000;

    let d="M0 "+H+"L"+p[0][0]+" "+p[0][1];for(let i=1;i<p.length;i++)d+="Q"+p[i-1][0]+" "+p[i-1][1]+" "+((p[i-1][0]+p[i][0])>>1)+" "+((p[i-1][1]+p[i][1])>>1);return d+"L"+W+" "+p[p.length-1][1]+"L"+W+" "+H+"Z"};
  const scene=(ciel,sol,couches)=>{let s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMax slice"><defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1">'+ciel.map(c=>'<stop offset="'+c[0]+'" stop-color="'+c[1]+'"/>').join("")+'</linearGradient><radialGradient id="g"><stop offset="0" stop-color="'+sol[3]+'" stop-opacity=".9"/><stop offset="1" stop-color="'+sol[3]+'" stop-opacity="0"/></radialGradient></defs><rect width="'+W+'" height="'+H+'" fill="url(#s)"/><circle cx="'+sol[0]+'" cy="'+sol[1]+'" r="'+sol[2]*4+'" fill="url(#g)"/><circle cx="'+sol[0]+'" cy="'+sol[1]+'" r="'+sol[2]+'" fill="'+sol[3]+'"/>';
    couches.forEach(c=>{s+='<path d="'+c[0]+'" fill="'+c[1]+'"/>'});return 'url("data:image/svg+xml,'+encodeURIComponent(s+"</svg>")+'")'};
  return{aube:()=>scene([[0,"#2a1f4d"],[.45,"#b0619a"],[.75,"#ff9e7a"],[1,"#ffd3a5"]],[1050,560,46,"#fff1d6"],[[crete(1,560,60,16,.5),"#c77b9a"],[crete(2,640,70,16,.5),"#8f5486"],[crete(3,730,80,16,.5),"#5e3a6e"],[crete(4,830,70,16,.5),"#3a2650"],[crete(5,920,50,16,.5),"#21173a"]]),
    brume:()=>scene([[0,"#c9dcc8"],[.6,"#e8efe0"],[1,"#f3f5ec"]],[1200,300,40,"#fbfff2"],[[crete(31,520,70,24,1.4),"#a9c2a8"],[crete(32,610,80,24,1.4),"#86a888"],[crete(33,700,80,24,1.4),"#5f8a66"],[crete(34,800,70,24,1.4),"#3e6a4a"],[crete(35,900,60,24,1.4),"#22422f"]])}})();
const frLum=hex=>{const n=parseInt(hex,16);return(0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255))/255};
/* Pose un style Fil Rouge (ou le retire si id est vide). Le thème Sombre / Lumineux de base suit la couleur de fond du style. */
function frApply(id,pal){
  const R=document.documentElement,t=FR_T[id];
  if(!t){["data-da","data-da-sombre","data-da-rond"].forEach(a=>R.removeAttribute(a));["--da-fond","--da-texte","--da-accent","--da-on","--da-image"].forEach(v=>R.style.removeProperty(v));return}
  if(!document.getElementById("fr-da-fonts")){const l=document.createElement("link");l.id="fr-da-fonts";l.rel="stylesheet";l.href=FR_FONTS;document.head.append(l)}
  let c=String(pal||t[2]).split(",");if(c.length!==3||!c.every(x=>HEX6.test(x)))c=t[2].split(",");
  const dark=frLum(c[0])<.5;

/* Un service est visible si l'administrateur l'a activé pour tous, si le rôle de la personne le permet et si son accès module n'est pas décoché. */
function feat(k){
  if(S.cfg&&S.cfg.features[k]===false)return false;
  if(S.isAdmin||!S.role)return true;
  const r=S.role;
  if((k==="create"||k==="edit"||k==="minors"||k==="paid"||k==="import")&&r!=="gest")return false;
  if(k==="signature"&&r==="lect")return false;
  const mk=k==="minors"||k==="paid"||k==="edit"?"create":k;
  if(MODS.some(m=>m[0]===mk)&&S.myMods[mk]===false)return false;

/* ---------- comptes : rôles, invitations, demandes d'accès (comme l'Inventaire M la créative) ---------- */
const APP_URL="https://claude.ai/artifact/Y2T6SBRVZjT12CCBvm1aNc";
const PROLES={admin:"Administrateur",gest:"Gestionnaire",sign:"Signataire",lect:"Lecture seule"};
const PROLE_HINT={admin:"Tout gérer, y compris les comptes (propriétaire de l'appli)",gest:"Crée, modifie, signe et exporte les autorisations",sign:"Consulte et signe les autorisations qui le concernent",lect:"Consulte seulement"};
const MODS=[["library","Bibliothèque"],["create","Nouvelle autorisation"],["signature","Signature"],["pdf","PDF"],["import","Import papier"],["reminders","Rappels"]];
const normEmail=e=>String(e||"").trim().toLowerCase();
const isEmail=e=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e);
const nowIso=()=>new Date().toISOString();
function myInvite(){if(!S.email)return null;return S.invites.find(i=>normEmail(i.email)===S.email&&i.status!=="revoked")||null}
function computeRole(){
  const rec=S.roles[S.uid];let r=null;
  if(S.isAdmin)r="admin";
  else if(rec&&(PROLES[rec.role]||rec.role==="none"))r=rec.role==="admin"?"gest":rec.role;
  else{const iv=myInvite();if(iv&&PROLES[iv.role])r=iv.role;else if(S.uid&&S.profiles[S.uid])r="gest";else if(S.rolesReady&&S.invLoaded&&S.loaded)r="none"}
  S.role=r;S.myMods=(rec&&rec.mods&&typeof rec.mods==="object")?rec.mods:{};
}
function accBoot(){
  const db=S.db;
  try{db.collection("roles").onSnapshot(s=>{S.roles={};s.docs.forEach(d=>{const x=d.data()||{};S.roles[d.id]={role:x.role,mods:x.mods||{},email:x.email||"",at:x.updatedAt||""}});S.rolesReady=true;accAfter()},()=>{S.rolesReady=true;accAfter()})}catch(e){S.rolesReady=true}
  try{db.collection("invites").onSnapshot(s=>{S.invites=s.docs.map(d=>({id:d.id,...(d.data()||{})}));S.invLoaded=true;accAfter()},()=>{S.invLoaded=true;accAfter()})}catch(e){S.invLoaded=true}
  if(S.isAdmin){try{db.collection("access").onSnapshot(s=>{S.access=s.docs.map(d=>({id:d.id,...(d.data()||{})}));S.accLoaded=true;accAfter();names(S.access.map(a=>a.id)).then(()=>{if(S.view==="admin")cfgRender()})},()=>{S.accLoaded=true})}catch(e){S.accLoaded=true}}
  else{const rd=async()=>{try{const d=await db.doc("access/"+S.uid).get();S.myAccess=d&&d.exists?{id:S.uid,...(d.data()||{})}:null}catch(e){}S.accLoaded=true;accAfter()};rd();setInterval(()=>{if(S.role==="none")rd()},20000)}
}
let accT=null;
function accAfter(){clearTimeout(accT);accT=setTimeout(()=>{const before=S.role;computeRole();adminNav();autoLinkInvites();selfAnnounce();if(S.loaded&&(before!==S.role||S.view==="admin"||S.role==="none"))cfgRender()},60)}
/* La personne invitée se signale à sa première connexion : l'administrateur la relie à son invitation. */
let announced=false;
async function selfAnnounce(){
  if(announced||S.isAdmin||!S.accLoaded||S.myAccess||!S.uid)return;const iv=myInvite();if(!iv)return;announced=true;
  const d={uid:S.uid,email:S.email,accountEmail:S.email,name:S.meName,roleWanted:iv.role,msg:"",status:"pending",via:"invite",at:nowIso()};
  try{await S.db.doc("access/"+S.uid).set(d);S.myAccess={id:S.uid,...d}}catch(e){}
}
const linking=new Set();
async function autoLinkInvites(){
  if(!S.isAdmin||!S.accLoaded||!S.invLoaded||!S.rolesReady)return;
  for(const a of S.access){
    if(S.roles[a.id]||linking.has(a.id)||a.status==="refused"||a.status==="removed")continue;
    const iv=S.invites.find(i=>i.status!=="revoked"&&i.status!=="accepted"&&(normEmail(i.email)===normEmail(a.email)||normEmail(i.email)===normEmail(a.accountEmail)));
    if(!iv)continue;linking.add(a.id);
    try{await S.db.doc("roles/"+a.id).set({role:iv.role,mods:{},email:normEmail(a.email||a.accountEmail),updatedAt:nowIso(),by:S.uid,via:"invite"});
      await S.db.doc("access/"+a.id).set(clean({...a,id:undefined,status:"approved",role:iv.role,decidedAt:nowIso(),note:"Invitation"}));
      await S.db.doc("invites/"+iv.id).set(clean({...iv,id:undefined,status:"accepted",acceptedAt:nowIso(),uid:a.id}))}catch(e){}
  }
}
function clean(o){return JSON.parse(JSON.stringify(o))}

  return el("div",{class:"card",style:"display:grid;gap:12px;max-width:560px"},who,el("h2",{text:"Demander l'accès"}),
    a&&a.status==="refused"?el("div",{class:"banner",style:"border-left-color:var(--bad)",text:"Votre précédente demande a été refusée. Vous pouvez en refaire une."}):null,

      G.busy=false;render()},text:"Demander l'accès"})));
}

}

  return[

<script id="jp-ux-js">
(function(){
  if(window.JPUX)return;
