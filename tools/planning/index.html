<!doctype html>
<html lang="fr" data-theme="a">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outils collaboratifs d’agence — Planning</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,slnt,wdth,wght@8..144,-10..0,25..151,300..1000&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block" rel="stylesheet">
<style>
/* ===== Système graphique IA Studio ===== */
:root{color-scheme:light;--ink:#000;--paper:#fff;--mid:#5c5c5c;--soft:#efefef;--line:#cfcfcf;--hatch:rgba(0,0,0,.08);--bd:var(--ink);--bd2:var(--ink);--card:var(--paper);--band:var(--ink);--band-t:var(--paper);--red:#E3120B;--red-on-ink:#FF3B30;--we:rgba(0,0,0,.035)}
:root[data-theme="a"]{color-scheme:dark;--ink:#ECECEC;--paper:#000;--mid:#A0A0A0;--soft:#161616;--line:#222;--hatch:rgba(255,255,255,.06);--bd:#2c2c2c;--bd2:#3a3a3a;--card:#111;--band:#111;--band-t:#fff;--we:rgba(255,255,255,.035)}
:root[data-theme="cream"]{color-scheme:light;--paper:#F4EEE3;--ink:#1B1814;--mid:#5E574D;--soft:#EAE2D4;--line:#DCD3C4;--hatch:rgba(27,24,20,.07);--bd:#D3C8B6;--bd2:#BFB29D;--card:#FBF7F0;--band:#1B1814;--band-t:#F4EEE3;--rail:#1B1814;--rail-t:#F4EEE3}
:root[data-theme="custom"]{--mid:color-mix(in srgb,var(--ink) 64%,var(--paper));--soft:color-mix(in srgb,var(--ink) 7%,var(--paper));--line:color-mix(in srgb,var(--ink) 14%,var(--paper));--hatch:color-mix(in srgb,var(--ink) 8%,transparent);--bd:color-mix(in srgb,var(--ink) 20%,var(--card));--bd2:color-mix(in srgb,var(--ink) 32%,var(--card));--we:color-mix(in srgb,var(--ink) 4%,transparent)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Roboto Flex",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
[hidden]{display:none!important}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:20px;line-height:1;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:"liga";font-variation-settings:"FILL" 0,"wght" 500,"opsz" 24;user-select:none;overflow:hidden;width:1em;flex:none}

/* shell */
.app{height:100%;display:grid;grid-template-columns:96px minmax(0,1fr)}
.rail{background:var(--rail,#000);color:var(--rail-t,#fff);display:flex;flex-direction:column;padding:14px 0 12px;gap:2px;overflow:hidden}
:root[data-theme="a"] .rail{background:#0A0A0A;box-shadow:inset -1px 0 0 #222}
.rail-logo{margin:0 16px 14px;height:50px;background:#fff;color:var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.rail-logo b{font-size:21px;font-weight:950;font-variation-settings:"wdth" 60,"slnt" -10;letter-spacing:-.02em}
.rail-logo span{font-size:8.5px;font-weight:900;letter-spacing:.22em;margin-top:1px}
.rail-scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;scrollbar-width:none}
.rail-fixed{flex:none;display:flex;flex-direction:column;gap:2px;border-top:1px solid #222;padding-top:8px;margin-top:4px}
.rail-btn{position:relative;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;color:var(--rail-t,#fff);font-size:11.5px;font-weight:700;font-variation-settings:"wdth" 85;opacity:.72}
.rail-btn:hover{opacity:1}
.rail-btn .ms{font-size:22px;position:relative;z-index:1}
.rail-btn .l{position:relative;z-index:1;text-align:center}
.rail-btn[aria-current="page"]{opacity:1;color:#fff}
.rail-btn[aria-current="page"]::before{content:"";position:absolute;inset:3px 10px;background:var(--red);transform:skewX(-14deg)}
:root[data-theme="light"] .rail-btn[aria-current="page"]{color:#000}
:root[data-theme="light"] .rail-btn[aria-current="page"]::before{background:#fff}
:root[data-theme="light"] .rail-btn[aria-current="page"]::after{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:4px;background:var(--red);transform:skewX(-14deg)}
main{min-width:0;min-height:0;overflow:auto;position:relative}
.view{min-height:100%;display:flex;flex-direction:column}

/* hero */
.hero{display:flex;align-items:stretch;flex-wrap:wrap;padding-right:32px;flex:none}
.hero-ink{background:var(--band);color:var(--band-t);clip-path:polygon(0 0,100% 0,calc(100% - 90px) 100%,0 100%);padding:24px 130px 22px 32px;flex:1 1 520px;max-width:960px;display:flex;flex-direction:column;gap:6px;min-width:0}
:root:not([data-theme="light"]) .hero-ink{box-shadow:inset 0 -3px 0 var(--red)}
.stripe{width:110px;margin-left:-86px;background:var(--red);clip-path:polygon(96px 0,100px 0,10px 100%,6px 100%);flex:none}
.kicker{align-self:flex-start;background:var(--red);color:#fff;font-size:12.5px;font-weight:800;font-variation-settings:"wdth" 120;letter-spacing:.1em;padding:4px 18px 4px 9px;clip-path:polygon(0 0,100% 0,calc(100% - 9px) 100%,0 100%)}
.h1{margin:0;font-size:clamp(30px,4.2vw,52px);line-height:1.02;font-weight:900;font-variation-settings:"wdth" 52,"slnt" -10}
.hero .sub{margin:2px 0 0;font-size:14px;max-width:64ch;opacity:.86}
.hero-actions{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:10px;margin-left:auto;padding:16px 0 12px 16px}
.hero-actions .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.page{padding:26px 32px 96px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 26px;border:0;background:var(--red);color:#fff;font-weight:800;font-size:14px;font-variation-settings:"wdth" 92;cursor:pointer;clip-path:polygon(13px 0,100% 0,calc(100% - 13px) 100%,0 100%);white-space:nowrap}
.btn:hover{box-shadow:inset 0 -4px 0 rgba(0,0,0,.35)}
:root[data-theme="light"] .btn{background:#000}
:root[data-theme="light"] .btn:hover{box-shadow:inset 0 -4px 0 var(--red)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{height:36px;padding:0 20px;font-size:13px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.btn.ghost{background:transparent;color:var(--ink);clip-path:none;box-shadow:inset 0 -3px 0 var(--bd2);padding:0 8px}
.btn.ghost:hover{box-shadow:inset 0 -3px 0 var(--red)}
.btn.line{background:var(--card);color:var(--ink);clip-path:none;border:2px solid var(--bd2);padding:0 16px}
:root[data-theme="a"] .btn.line{background:#141414;border-color:#333;border-radius:10px}
.btn.line:hover{background:var(--ink);color:var(--paper);box-shadow:none}
.btn.danger{background:transparent;color:var(--red);clip-path:none;box-shadow:inset 0 -3px 0 var(--red);padding:0 8px}
.btn .ms{font-size:19px}
.ib{width:34px;height:34px;border:0;background:transparent;color:var(--ink);display:inline-grid;place-items:center;cursor:pointer;flex:none}
.ib:hover{background:var(--red);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1.5px solid var(--bd2);background:transparent;color:var(--ink);cursor:pointer;font-weight:650;font-size:13px;white-space:nowrap}
:root[data-theme="a"] .chip{border-color:#333;border-radius:999px;background:#141414}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
:root[data-theme="light"] .chip[aria-pressed="true"]{background:#000;border-color:#000}
:root[data-theme="a"] .chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:inline-flex;border:2px solid var(--bd);min-height:38px;flex:none;align-self:flex-start}
.seg button{border:0;background:transparent;padding:0 12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:700;font-size:13px;color:var(--ink)}
.seg button+button{border-left:2px solid var(--bd)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
:root[data-theme="a"] .seg{border-color:#2c2c2c;border-radius:12px;background:#141414;padding:3px;gap:3px}
:root[data-theme="a"] .seg button{border-radius:8px}
:root[data-theme="a"] .seg button+button{border-left:0}
:root[data-theme="a"] .seg button[aria-pressed="true"]{background:#fff;color:#000;border-radius:0;clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%)}
.field{display:flex;flex-direction:column;gap:2px;min-width:0}
.lbl,.field>label{font-size:12px;font-weight:800;font-variation-settings:"wdth" 80}
.in,.sel,.ta{width:100%;border:0;border-bottom:1.5px solid var(--bd2);border-radius:0;background:transparent;color:var(--ink);padding:6px 0 7px;font-size:14px;min-height:36px}
:root[data-theme="light"] .in,:root[data-theme="light"] .sel{border-bottom-color:#000}
.in:focus,.sel:focus,.ta:focus{outline:none;border-bottom:3px solid var(--red);padding-bottom:5.5px}
.sel{appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 10px) 55%,calc(100% - 5px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:22px}
.sel option{background:var(--card);color:var(--ink)}
input[type=checkbox],input[type=radio]{accent-color:var(--red);width:18px;height:18px;margin:0}
input[type=color].sw{width:40px;height:32px;border:1px solid var(--bd);padding:0;background:none;cursor:pointer}
.check{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;cursor:pointer}
.note{font-size:12.5px;color:var(--mid);margin:0}
.tag{display:inline-block;background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:3px 16px 3px 9px;clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%);white-space:nowrap}
.tag.k{background:var(--ink);color:var(--paper)}
.row2{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.snack{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);background:#fff;color:#000;box-shadow:inset 4px 0 0 var(--red),0 6px 24px rgba(0,0,0,.25);padding:13px 22px;min-width:240px;max-width:min(560px,calc(100% - 32px));opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:200;font-weight:650;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.snack.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* dialogs */
dialog.dlg{border:1px solid var(--bd);padding:0;background:var(--card);color:var(--ink);width:min(760px,calc(100% - 28px));max-height:calc(100% - 40px);display:none;flex-direction:column;border-radius:0}
dialog.dlg[open]{display:flex}
:root[data-theme="light"] dialog.dlg{border:3px solid #000}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg-head{display:flex;align-items:center;min-height:62px}
.dlg-head .band{background:var(--band);color:var(--band-t);clip-path:polygon(0 0,100% 0,calc(100% - 40px) 100%,0 100%);padding:14px 64px 14px 22px;flex:1;min-width:0}
:root:not([data-theme="light"]) .dlg-head .band{box-shadow:inset 0 -3px 0 var(--red)}
.dlg-head h2{margin:0;font-size:23px;line-height:1.1;font-weight:900;font-variation-settings:"wdth" 60,"slnt" -10}
.dlg-head .band span{font-size:12.5px;opacity:.85}
.dlg-head .ib{margin:0 12px}
.dlg-body{overflow:auto;padding:18px 22px;display:grid;grid-template-columns:1fr 1fr;gap:16px 22px}
.dlg-body .wide{grid-column:1/-1}
.dlg-foot{display:flex;align-items:center;gap:10px;padding:14px 22px 18px;border-top:1px solid var(--bd);flex-wrap:wrap}
.alert{grid-column:1/-1;border-left:6px solid var(--red);background:var(--soft);padding:10px 14px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.alert strong{display:flex;align-items:center;gap:6px;color:var(--red)}
.alert ul{margin:0;padding-left:18px}

/* ===== Planning ===== */
.toolbar{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:14px 32px 12px;border-bottom:1px solid var(--bd);flex:none}
.toolbar .range{font-weight:900;font-size:16px;font-variation-settings:"wdth" 70,"slnt" -8;min-width:190px;text-align:center}
.legend{display:flex;gap:12px;align-items:center;font-size:12px;font-weight:700;color:var(--mid)}
.legend i{display:inline-block;width:22px;height:12px;vertical-align:-2px;margin-right:5px;border:1px solid var(--bd2)}
.legend .lo{background:repeating-linear-gradient(-45deg,var(--red) 0 3px,transparent 3px 7px)}
.legend .lc{background:var(--red)}
.legend .ll{background:repeating-linear-gradient(90deg,var(--mid) 0 2px,transparent 2px 6px)}
.gridwrap{flex:1;min-height:0;overflow:auto;position:relative;user-select:none}
table.pl{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
.pl th,.pl td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0}
.pl thead th{position:sticky;background:var(--paper);z-index:3}
.pl thead tr.g th{top:0;height:34px}
.pl thead tr.s th{top:34px;height:26px}
.pl thead tr.r th{top:60px;height:52px}
.pl th.corner{left:0;z-index:5;min-width:118px;width:118px}
.pl th.corner2{left:118px;z-index:5;min-width:34px;width:34px}
th.grp{text-align:left;padding:0 6px 0 10px;background:var(--band)!important;color:var(--band-t);font-size:13px;font-weight:900;font-variation-settings:"wdth" 68,"slnt" -8;white-space:nowrap;box-shadow:inset 0 -3px 0 var(--red)}
th.grp .gh,th.sub .gh{display:flex;align-items:center;gap:6px}
th.grp .ib,th.sub .ib{width:24px;height:24px;color:inherit}
th.grp .ib .ms,th.sub .ib .ms{font-size:18px}
th.sub{text-align:left;padding:0 4px 0 8px;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;background:var(--soft)!important;color:var(--ink)}
th.res{min-width:92px;max-width:120px;padding:4px 6px;text-align:left;vertical-align:bottom;font-weight:800;line-height:1.15}
th.res b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
th.res span{display:block;font-size:10.5px;font-weight:600;color:var(--mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
th.res .ext{display:inline-block;font-size:9px;font-weight:900;background:var(--ink);color:var(--paper);padding:0 5px;margin-top:2px}
th.fold,td.fold{min-width:30px;width:30px;background:repeating-linear-gradient(-45deg,var(--hatch) 0 3px,transparent 3px 8px)!important}
th.fold{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10.5px;font-weight:900;text-align:left;padding:6px 0}
td.fold{cursor:default}
td.fold.busy{background:repeating-linear-gradient(-45deg,var(--red) 0 2px,transparent 2px 7px)!important;opacity:.6}
.pl tbody th{position:sticky;background:var(--paper);z-index:2;text-align:left;font-weight:800}
.pl tbody th.day{left:0;width:118px;padding:4px 8px;vertical-align:top;border-bottom:2px solid var(--bd2);cursor:pointer}
.pl tbody th.day:hover{color:var(--red)}
.pl tbody th.day b{display:block;font-size:20px;font-weight:900;font-variation-settings:"wdth" 60,"slnt" -10;line-height:1}
.pl tbody th.day span{font-size:11px;text-transform:capitalize}
.pl tbody th.day.today b{background:var(--red);color:#fff;display:inline-block;padding:0 10px 0 6px;clip-path:polygon(0 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.pl tbody th.half{left:118px;width:34px;font-size:10.5px;color:var(--mid);text-align:center}
.pl tr.pm th.half,.pl tr.pm td{border-bottom:2px solid var(--bd2)}
.pl tr.we td,.pl tr.we th{background-color:var(--we)}
.pl td.c{height:26px;min-width:92px;max-width:120px;position:relative;cursor:cell}
.pl td.c:hover{box-shadow:inset 0 0 0 2px var(--red)}
.pl td.c.sel{box-shadow:inset 0 0 0 2px var(--red);background:color-mix(in srgb,var(--red) 22%,transparent)!important}
.bk{position:absolute;inset:2px 3px;display:flex;align-items:center;padding:0 6px;font-size:11px;font-weight:800;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.bk.conf{background:var(--cc);color:var(--ct)}
.bk.opt{background:repeating-linear-gradient(-45deg,var(--cc) 0 4px,color-mix(in srgb,var(--cc) 25%,transparent) 4px 9px);color:var(--ink);text-shadow:0 0 3px var(--paper),0 0 2px var(--paper)}
.bk.link{box-shadow:inset 3px 0 0 var(--ink)}
.bk.cont{border-top-left-radius:0}
.leave{position:absolute;inset:2px 3px;background:repeating-linear-gradient(90deg,var(--mid) 0 2px,transparent 2px 7px);opacity:.55;display:grid;place-items:center;font-size:10px;font-weight:900;color:var(--ink)}
.leave span{background:var(--paper);padding:0 5px;opacity:1}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,calc(env(safe-area-inset-bottom) + 12px));margin:0;width:max-content;max-width:calc(100vw - 24px);display:flex;flex-wrap:wrap;justify-content:center;gap:10px 12px;align-items:center;background:var(--band);color:var(--band-t);padding:8px 10px 8px 18px;box-shadow:inset 0 -3px 0 var(--red),0 10px 30px rgba(0,0,0,.35);z-index:2147482000;font-weight:800;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.selbar{-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%)}
:root[data-da-sombre] .selbar{background:color-mix(in srgb,var(--da-fond,#07090f) 84%,transparent)}
.selbar .btn.opt{background:transparent;color:var(--band-t);border:1px dashed currentColor}
@media print{.selbar{display:none!important}}
.selbar .btn.ghost{color:var(--band-t)}

/* listes / bibliothèques */
.sec{display:flex;flex-direction:column;gap:12px;padding:18px;background:var(--card);border:1px solid var(--bd);margin-bottom:22px}
:root[data-theme="light"] .sec{border:0;border-top:3px solid #000;padding:14px 0}
.sec h2{margin:0;font-size:19px;font-weight:900;font-variation-settings:"wdth" 70,"slnt" -8;display:flex;align-items:center;gap:10px}
.sec h2::before{content:"";width:16px;height:12px;background:var(--red);transform:skewX(-20deg)}
.tbl{display:flex;flex-direction:column}
.tr{display:grid;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;min-width:0}
.tr.h{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;color:var(--mid);border-bottom:2px solid var(--red)}
.tr>*{min-width:0}
.tr .in,.tr .sel{min-height:30px;padding:3px 0}
.add{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;padding-top:6px}
.add .field{flex:1 1 150px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:20px}
.ccard{background:var(--card);border:1px solid var(--bd);display:flex;flex-direction:column;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%)}
.ccard-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:4px solid var(--cc)}
.ccard-h .in{font-weight:900;font-size:17px;font-variation-settings:"wdth" 70,"slnt" -6;border-bottom-color:transparent}
.ccard-b{padding:10px 14px 14px;display:flex;flex-direction:column;gap:6px}
.proj{display:flex;align-items:center;gap:6px;font-size:13px}
.proj .in{min-height:28px;padding:2px 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}

/* mail */
.mail{max-width:720px;background:#fff;color:#111;border:1px solid var(--bd);font-size:14px}
.mail-h{padding:14px 20px;border-bottom:1px solid #ddd;font-size:13px;display:flex;flex-direction:column;gap:2px;background:#fafafa}
.mail-b{padding:20px 24px}

/* ============================================================

const KEY = "pa-data-v1", UIKEY = "pa-ui";
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "style" && typeof v === "object") for (const [sk, sv] of Object.entries(v)) { if (sk.startsWith("--")) n.style.setProperty(sk, sv); else n.style[sk] = sv; }
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
}
function armed(btn, label, fn) { let t; btn.addEventListener("click", () => { if (btn.dataset.armed) { clearTimeout(t); fn(); return; } btn.dataset.armed = "1"; const old = btn.innerHTML; btn.textContent = label; t = setTimeout(() => { delete btn.dataset.armed; btn.innerHTML = old; }, 3500); }); return btn; }

  ];
  const clients = [
    { id: uid(), name: "Pharmabest", color: "#2E7D32", projects: [{ id: uid(), name: "Opération Solaire" }, { id: uid(), name: "Séminaire Marbella" }] },

}

/* Bloc Styles dans Réglages › Interface */
.frda-inline{grid-column:1/-1;display:flex;flex-direction:column;gap:10px;margin:14px 0;padding:14px;border:1px solid var(--bd,#888);background:var(--card,transparent);color:var(--ink,inherit)}
.frda-inline h5{margin:0;font:600 12px/1.2 inherit;font-family:inherit;text-transform:uppercase;letter-spacing:.08em}
.frda-inline .frda-etat{margin:0;font-size:12px;color:var(--mid,inherit)}
.frda-inline button{font:inherit;color:inherit;cursor:pointer}
.frda-couleurs{display:flex;flex-direction:column;gap:8px}.frda-couleurs[hidden]{display:none}
.frda-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.frda-th{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;padding:7px;border-radius:10px;border:1px solid var(--bd,#888);background:var(--card,#fff)}
.frda-th[aria-pressed=true]{outline:2px solid var(--red,#e3120b);outline-offset:1px}
.frda-th i{display:block;width:100%;height:30px;border-radius:6px;border:1px solid rgba(128,128,128,.4)}
.frda-th b{font-weight:600;font-size:13px}.frda-th small{font-size:11px;opacity:.7}
.frda-pals{display:flex;flex-wrap:wrap;gap:6px}
.frda-pal{display:flex;padding:3px;border-radius:8px;border:1px solid var(--bd,#888);background:var(--card,#fff)}
.frda-pal i{display:block;width:17px;height:17px}
.frda-champs{display:flex;gap:12px;flex-wrap:wrap}.frda-champs label{display:flex;align-items:center;gap:6px;font-size:12px}
.frda-champs input{width:36px;height:26px;padding:0;border:1px solid var(--bd,#888);border-radius:6px;background:none}

  .jpux-print-head{display:block!important;font:700 12px/1.4 system-ui,sans-serif;margin:0 0 10px;border-bottom:1px solid #000;padding-bottom:6px}
  *{box-shadow:none!important;animation:none!important;transition:none!important}
}
.jpux-print-head{display:none}
</style>
<script id="jp-ux-js">
(function(){
  if(window.JPUX)return;
  var C=Object.assign({app:"Application",scroll:null,search:null,openSearch:null,contactEmail:"",contactLabel:"Écrire à l'administrateur",faq:[],faqTarget:null,privacy:"",copySel:"",stickySel:"",railWidth:0,utmKey:"jpux_utm",printTitle:null},window.JPUX_CONFIG||{});
  var D=document,R=D.documentElement;
  function el(t,c,x){var n=D.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n}
  function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
  function scroller(){return (C.scroll&&D.querySelector(C.scroll))||D.scrollingElement||R}
  var prefersNoMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* 16. Messages : succès, erreur, info */
  var box=el("div","jpux-toasts");box.setAttribute("role","status");box.setAttribute("aria-live","polite");
  function toast(msg,kind,ms){var t=el("div","jpux-toast "+(kind||""));t.append(el("span","",(kind==="err"?"⚠️ ":kind==="info"?"ℹ️ ":"✓ ")+msg));var x=el("button","","×");x.setAttribute("aria-label","Fermer");x.onclick=function(){t.remove()};t.append(x);box.append(t);setTimeout(function(){t.remove()},ms||(kind==="err"?7000:3200));return t}

  /* 17. Fenêtre de confirmation */
  function confirmBox(o){o=typeof o==="string"?{msg:o}:o||{};return new Promise(function(res){
    var m=el("div","jpux-modal"),b=el("div");b.setAttribute("role","alertdialog");b.setAttribute("aria-modal","true");
    b.append(el("h2","",o.title||"Confirmer"),el("p","",o.msg||"Êtes-vous sûr ?"));
    var row=el("div","row"),no=el("button","",o.cancel||"Annuler"),ok=el("button","go"+(o.danger?" danger":""),o.ok||"Confirmer");
    function end(v){m.remove();D.removeEventListener("keydown",k,true);res(v)}
    function k(e){if(e.key==="Escape"){e.stopPropagation();e.preventDefault();end(false)}}
    no.onclick=function(){end(false)};ok.onclick=function(){end(true)};m.onclick=function(e){if(e.target===m)end(false)};
    row.append(no,ok);b.append(row);m.append(b);D.body.append(m);D.addEventListener("keydown",k,true);ok.focus();
  })}

  /* 8. Barre de progression (défilement + travail en cours) */
  var prog=el("div","jpux-prog");prog.setAttribute("aria-hidden","true");var busyN=0;
  function busy(on){busyN=Math.max(0,busyN+(on?1:-1));prog.classList.toggle("busy",busyN>0);if(!busyN)onScroll()}
  /* 4. Bouton retour en haut */
  var topB=el("button","jpux-float jpux-top");topB.type="button";topB.setAttribute("aria-label","Revenir en haut");topB.innerHTML='<span aria-hidden="true" style="font-size:20px">↑</span>';
  topB.onclick=function(){var s=scroller();(s===R?window:s).scrollTo({top:0,behavior:prefersNoMotion?"auto":"smooth"});};
  function onScroll(){var s=scroller(),y=s===R?window.scrollY:s.scrollTop,h=(s===R?R.scrollHeight-innerHeight:s.scrollHeight-s.clientHeight);topB.classList.toggle("on",y>400);if(!busyN)prog.style.transform="scaleX("+(h>0?Math.min(1,y/h):0)+")"}

  /* 20. Bouton contact / aide flottant */
  var help=el("button","jpux-float jpux-help");help.type="button";help.setAttribute("aria-haspopup","menu");help.setAttribute("aria-expanded","false");help.innerHTML='<span aria-hidden="true">💬</span><span>Aide</span>';
  var menu=null;
  function closeMenu(){if(menu){menu.remove();menu=null;help.setAttribute("aria-expanded","false")}}
  help.onclick=function(e){e.stopPropagation();if(menu)return closeMenu();menu=el("div","jpux-menu");menu.setAttribute("role","menu");
    var sub=encodeURIComponent("["+C.app+"] Demande d'aide"),body=encodeURIComponent("Bonjour,\n\nPage : "+location.href.split("?")[0]+"\n\nMa question : ");
    var a=el("a","",(C.contactEmail?"✉️ ":"✉️ ")+C.contactLabel);a.href="mailto:"+(C.contactEmail||"")+"?subject="+sub+"&body="+body;a.setAttribute("role","menuitem");menu.append(a);
    if(D.querySelector(".jpux-faq")){var f=el("button","","❓ Questions fréquentes");f.setAttribute("role","menuitem");f.onclick=function(){closeMenu();if(C.showFaq)C.showFaq();setTimeout(function(){var q=D.querySelector(".jpux-faq");if(q){q.scrollIntoView({behavior:prefersNoMotion?"auto":"smooth",block:"start"});var d=q.querySelector("details");if(d)d.open=true}},60)};menu.append(f)}
    var p=el("button","","🖨️ Version imprimable");p.setAttribute("role","menuitem");p.onclick=function(){closeMenu();print()};menu.append(p);
    var c=el("button","","🍪 Cookies et données");c.setAttribute("role","menuitem");c.onclick=function(){closeMenu();cookie(true)};menu.append(c);
    D.body.append(menu);help.setAttribute("aria-expanded","true");menu.querySelector("a,button").focus()};
  D.addEventListener("click",function(e){if(menu&&!menu.contains(e.target))closeMenu()});
  D.addEventListener("keydown",function(e){if(e.key==="Escape")closeMenu()});

  /* 2. Bandeau cookies (information, aucun traceur) */
  function cookie(force){if(!force&&ls("jpux_cookies"))return;var old=D.querySelector(".jpux-cookie");if(old)old.remove();
    var b=el("div","jpux-cookie");b.setAttribute("role","region");b.setAttribute("aria-label","Cookies");
    b.append(el("p","",C.privacy||"Cette appli n'utilise aucun cookie publicitaire ni traceur. Seuls vos réglages d'affichage (thème, densité, choix récents) sont gardés dans ce navigateur."));
    var ok=el("button","ok","J'ai compris");ok.onclick=function(){ls("jpux_cookies",{ok:true,at:new Date().toISOString()});b.remove()};
    var no=el("button","","Effacer mes réglages");no.onclick=async function(){if(await confirmBox({title:"Effacer vos réglages ?",msg:"Thème, densité et préférences de ce navigateur seront remis à zéro.",ok:"Effacer",danger:true})){try{Object.keys(localStorage).forEach(function(k){localStorage.removeItem(k)})}catch(e){}ls("jpux_cookies",{ok:true,at:new Date().toISOString()});location.reload()}};
    b.append(no,ok);D.body.append(b)}

  /* 14. Suivi UTM (source de la visite, gardée dans ce navigateur) */
  /* Les paramètres utm_* sont lus dans l'adresse (?utm_…) et après le n° dans l'ancre (#INV-0001&utm_…), comme sur les QR des étiquettes. */
  function utmParams(){var o={},q=new URLSearchParams(location.search),h=location.hash||"",i=h.search(/[&?]/),hq=new URLSearchParams(i>=0?h.slice(i+1):"");
    ["source","medium","campaign","content","term"].forEach(function(k){var v=q.get("utm_"+k)||hq.get("utm_"+k);if(v)o[k]=v});return o}
  function track(o){o=Object.assign({},o||{});if(!Object.keys(o).length)return;o.at=new Date().toISOString();o.page=location.pathname;var h=(location.hash||"").slice(1).split(/[&?]/)[0];if(h)o.cible=decodeURIComponent(h);var l=ls(C.utmKey)||[];l.unshift(o);ls(C.utmKey,l.slice(0,100))}
  var utmDone=false;function utm(){if(!utmDone){utmDone=true;track(utmParams())}return ls(C.utmKey)||[]}
  function tag(url,src,med,camp){try{var u=new URL(url,location.href);u.searchParams.set("utm_source",src||"app");u.searchParams.set("utm_medium",med||"lien");if(camp)u.searchParams.set("utm_campaign",camp);return u.toString()}catch(e){return url}}

  /* 9. Boutons copier */
  async function copy(text,btn){try{await navigator.clipboard.writeText(text)}catch(e){var t=el("textarea");t.value=text;D.body.append(t);t.select();try{D.execCommand("copy")}catch(_){}t.remove()}if(btn){var o=btn.textContent;btn.textContent="Copié ✓";setTimeout(function(){btn.textContent=o},1500)}toast("Copié dans le presse-papiers")}
  function enhance(root){
    if(C.copySel)root.querySelectorAll(C.copySel).forEach(function(n){if(n.dataset.jpuxCopy)return;var v=(n.textContent||"").trim();if(!v||v==="—")return;n.dataset.jpuxCopy="1";var b=el("button","jpux-copy","Copier");b.type="button";b.setAttribute("aria-label","Copier "+v);b.onclick=function(e){e.stopPropagation();copy(v,b)};n.append(b)});
    root.querySelectorAll("[data-jpux-copy-text]").forEach(function(n){if(n.dataset.jpuxBound)return;n.dataset.jpuxBound="1";n.addEventListener("click",function(e){e.stopPropagation();copy(n.getAttribute("data-jpux-copy-text"),n)})});
    /* 13. Afficher le mot de passe */
    root.querySelectorAll('input[type="password"]').forEach(function(i){if(i.dataset.jpuxPw)return;i.dataset.jpuxPw="1";var w=el("span","jpux-pw");i.parentNode.insertBefore(w,i);w.append(i);var b=el("button","","Afficher");b.type="button";b.setAttribute("aria-label","Afficher le mot de passe");b.onclick=function(){var s=i.type==="password";i.type=s?"text":"password";b.textContent=s?"Masquer":"Afficher";b.setAttribute("aria-label",s?"Masquer le mot de passe":"Afficher le mot de passe")};w.append(b)});
  }

  /* 19. FAQ dépliable */
  function faq(){if(!C.faq.length||!C.faqTarget)return;var t=D.querySelector(C.faqTarget);if(!t||t.querySelector(".jpux-faq"))return;
    var s=el("section","jpux-faq");s.id="faq";s.append(el("h3","","Questions fréquentes"));
    C.faq.forEach(function(q){var d=el("details"),sm=el("summary","",q[0]),dv=el("div","",q[1]);d.append(sm,dv);s.append(d)});t.append(s)}

  /* 10. Version imprimable : en-tête avec titre et date */
  var ph=el("div","jpux-print-head");
  addEventListener("beforeprint",function(){ph.textContent=(C.printTitle?C.printTitle():C.app)+" — imprimé le "+new Date().toLocaleString("fr-FR")});

  /* 3. Recherche : touche « / » ou Ctrl/⌘ K */
  D.addEventListener("keydown",function(e){var tg=e.target,typing=tg&&(tg.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName));
    if(((e.key==="/"&&!typing)||(e.key.toLowerCase()==="k"&&(e.metaKey||e.ctrlKey)))&&C.search){e.preventDefault();if(C.openSearch)C.openSearch();setTimeout(function(){var i=D.querySelector(C.search);if(i){i.focus();i.select&&i.select()}},30)}});

  /* 16. Erreurs inattendues et connexion */
  var lastErr=0;function oops(){if(Date.now()-lastErr<4000)return;lastErr=Date.now();toast("Un problème est survenu. Réessayez ; si ça continue, utilisez le bouton Aide.","err")}
  addEventListener("error",function(e){if(e&&e.target&&e.target!==window)return;oops()});
  addEventListener("unhandledrejection",function(){oops()});
  addEventListener("offline",function(){toast(window.JPOFF?"Connexion perdue : vous pouvez continuer, vos modifications seront envoyées dès son retour.":"Connexion perdue : vos modifications ne seront pas enregistrées tant qu'elle n'est pas revenue.",window.JPOFF?"info":"err",9000)});
  addEventListener("online",function(){toast("Connexion rétablie.","info")});

  function start(){
    /* 12. Lien d'accès direct au contenu */
    var main=(C.main&&D.querySelector(C.main))||D.querySelector("main");
    if(main){if(!main.id)main.id="contenu";if(!main.hasAttribute("tabindex"))main.setAttribute("tabindex","-1");var sk=el("a","jpux-skip","Aller au contenu");sk.href="#"+main.id;sk.onclick=function(e){e.preventDefault();main.focus();main.scrollIntoView()};D.body.prepend(sk)}
    if(C.railWidth)R.style.setProperty("--jpux-rail",C.railWidth+"px");
    D.body.append(prog,topB,help,box);D.body.prepend(ph);
    var s=scroller();(s===R?window:s).addEventListener("scroll",onScroll,{passive:true});onScroll();
    utm();faq();enhance(D);cookie(false);
    var tm=null;new MutationObserver(function(){clearTimeout(tm);tm=setTimeout(function(){enhance(D);faq()},80)}).observe(D.body,{childList:true,subtree:true});
  }
  window.JPUX={toast:toast,confirm:confirmBox,busy:busy,copy:copy,utm:utm,utmParams:utmParams,track:track,tagUrl:tag,cookies:function(){cookie(true)},config:C,version:"1.1"};
  if(D.readyState==="loading")D.addEventListener("DOMContentLoaded",start);else start();
})();
</script>
<!-- jp-ux:fin -->
