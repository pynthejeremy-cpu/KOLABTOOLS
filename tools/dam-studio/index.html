<!DOCTYPE html>
<html lang="fr">
<head>
<script src="core.js" data-mod="dam"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DAM Studio — M la créative</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090f; --ink:#eef1f7; --ink2:rgba(238,241,247,.66); --ink3:rgba(238,241,247,.42);
  --glass:rgba(255,255,255,.075); --glass2:rgba(255,255,255,.12); --stroke:rgba(255,255,255,.14); --stroke2:rgba(255,255,255,.26);
  --acc:#7cc4ff; --acc2:#b28cff; --ok:#4fdc9b; --warn:#ffc35a; --bad:#ff6b7a;
  --b1:#2b5cff; --b2:#a43cff; --b3:#00c2b8;
  --blur:22px; --radius:20px; --shadow:0 20px 60px rgba(0,0,0,.45);
  --font:'Manrope',system-ui,sans-serif; --serif:'Instrument Serif',Georgia,serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
body.light{
  --bg:#eef1f6; --ink:#141824; --ink2:rgba(20,24,36,.66); --ink3:rgba(20,24,36,.42);
  --glass:rgba(255,255,255,.55); --glass2:rgba(255,255,255,.78); --stroke:rgba(20,24,36,.10); --stroke2:rgba(20,24,36,.2);
  --shadow:0 20px 50px rgba(40,50,80,.16);
}
body.s-aube{--acc:#ff9f7a;--acc2:#ffcf6b;--b1:#ff6a3d;--b2:#ffb347;--b3:#ff5f8f}
body.s-brume{--acc:#9fd3c7;--acc2:#c3d7e8;--b1:#4c7a8a;--b2:#8aa6b8;--b3:#6fb7a8}
body.s-chrome{--acc:#d9dde6;--acc2:#9aa3b5;--b1:#5d6678;--b2:#a2abbd;--b3:#3d4352}
body.s-outrun{--acc:#ff4fd8;--acc2:#29e6ff;--b1:#ff2fb3;--b2:#6a2cff;--b3:#00d5ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--bg);overflow:hidden;font-size:14px;letter-spacing:.005em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--acc)}
.hidden{display:none!important}

/* living background */
#bgfx{position:fixed;inset:-10%;z-index:0;pointer-events:none;transition:transform .3s ease-out}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:float 22s ease-in-out infinite alternate}
body.light .blob{opacity:.38}
.blob.a{width:46vw;height:46vw;left:5%;top:5%;background:var(--b1)}
.blob.b{width:38vw;height:38vw;right:0;top:25%;background:var(--b2);animation-duration:28s}
.blob.c{width:34vw;height:34vw;left:30%;bottom:-5%;background:var(--b3);animation-duration:32s}
@keyframes float{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6vw,-4vh) scale(1.1)}100%{transform:translate(-4vw,5vh) scale(.95)}}
.grain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.06;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>")}
body.noglass .blob{display:none}

.glass{background:var(--glass);backdrop-filter:blur(var(--blur)) saturate(160%);-webkit-backdrop-filter:blur(var(--blur)) saturate(160%);border:1px solid var(--stroke);box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.18)}
body.light .glass{box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.9)}

/* layout */
#app{position:relative;z-index:1;height:100%;display:flex}
#side{width:248px;margin:14px 0 14px 14px;border-radius:var(--radius);display:flex;flex-direction:column;padding:18px 12px;gap:4px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-weight:800;color:#0b0d14;box-shadow:0 6px 20px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.6)}
.brand b{font-size:15px;display:block}
.brand small{color:var(--ink3);font-size:11px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:13px;color:var(--ink2);font-weight:600;transition:.2s;text-align:left;width:100%}
.nav:hover{background:var(--glass)}
.nav.on{background:var(--glass2);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--acc);color:#0b0d14;border-radius:10px;padding:1px 7px;font-weight:800}
.nav svg{width:18px;height:18px;flex-shrink:0}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--glass)}
.me .av{flex-shrink:0}
.me div{min-width:0}.me b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me small{color:var(--ink3);font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#main{flex:1;min-width:0;overflow-y:auto;padding:22px 26px 40px;scroll-behavior:smooth}
#tabbar{display:none}

.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#0b0d14;border:2px solid var(--bg)}
.avs{display:flex}.avs .av{margin-left:-8px}.avs .av:first-child{margin-left:0}

h1{font-family:var(--serif);font-weight:400;font-size:40px;line-height:1.05;margin:0;letter-spacing:-.01em}
h1 i{color:var(--acc)}
h2{font-size:15px;margin:0 0 12px;font-weight:700}
.sub{color:var(--ink2);margin-top:6px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:13px;background:var(--glass2);border:1px solid var(--stroke);font-weight:700;font-size:13px;transition:.18s;white-space:nowrap}
.btn:hover{border-color:var(--stroke2);transform:translateY(-1px)}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#0b0d14;border:0;box-shadow:0 8px 24px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.5)}
.btn.ok{background:var(--ok);color:#06210f;border:0}
.btn.sm{padding:7px 11px;font-size:12px;border-radius:10px}
.btn.ghost{background:transparent}
.btn svg{width:16px;height:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--glass);border:1px solid var(--stroke);color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{width:7px;height:7px;border-radius:50%}
.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;letter-spacing:.02em;white-space:nowrap}
.tag.v{background:rgba(124,196,255,.18);color:var(--acc)}
.tag.ok{background:rgba(79,220,155,.18);color:var(--ok)}
.tag.warn{background:rgba(255,195,90,.18);color:var(--warn)}
.tag.bad{background:rgba(255,107,122,.18);color:var(--bad)}
.tag.int{background:rgba(178,140,255,.18);color:var(--acc2)}
.muted{color:var(--ink3)}
.card{border-radius:var(--radius);padding:18px}
.input{width:100%;padding:12px 14px;border-radius:13px;background:var(--glass);border:1px solid var(--stroke);outline:none;transition:.2s}
.input:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(124,196,255,.15)}
label.f{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:14px 0 6px}
.search{position:relative;max-width:340px;flex:1}
.search input{padding-left:38px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;opacity:.5}

/* clients & projects */
.client{margin-bottom:30px}
.client-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.clogo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.client-h b{font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.pcard{border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .3s;transform-style:preserve-3d;will-change:transform;position:relative}
.pcard:hover{box-shadow:0 30px 70px rgba(0,0,0,.5)}
.pcover{height:150px;display:grid;grid-template-columns:2fr 1fr;grid-template-rows:repeat(2,minmax(0,1fr));gap:2px;background:#000;overflow:hidden}
.pcover img{width:100%;height:100%;min-height:0;object-fit:cover;display:block}
.pcover img:first-child{grid-row:span 2}
.pbody{padding:14px 16px 16px}
.pbody b{font-size:15px;display:block;margin-bottom:4px}
.pmeta{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.bar{height:5px;border-radius:5px;background:var(--glass2);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:5px}
.closed-ribbon{position:absolute;top:12px;right:12px}

/* project */
.crumbs{display:flex;align-items:center;gap:8px;color:var(--ink3);font-weight:600;margin-bottom:10px;font-size:13px}
.crumbs button{color:var(--ink2);font-weight:700}
.stepper{display:flex;gap:6px;margin:18px 0 6px;overflow-x:auto;padding-bottom:4px}
.step{flex:1;min-width:92px;padding:9px 10px;border-radius:12px;background:var(--glass);border:1px solid var(--stroke);font-size:11.5px;font-weight:700;color:var(--ink3);position:relative}
.step small{display:block;font-weight:600;opacity:.8;margin-top:2px}
.step.done{color:var(--ink2)}
.step.done::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px;background:var(--acc)}
.step.cur{background:var(--glass2);color:var(--ink);border-color:var(--acc)}
.step.val.cur,.step.val.done{border-color:var(--ok);color:var(--ok)}
.tabs{display:flex;gap:4px;padding:4px;border-radius:15px;margin:18px 0;width:max-content;max-width:100%;overflow-x:auto}
.tab{padding:8px 14px;border-radius:11px;font-weight:700;color:var(--ink2);font-size:13px;white-space:nowrap}
.tab.on{background:var(--glass2);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.srcbar{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;margin-top:14px;flex-wrap:wrap}
.srcbar .path{font-weight:700;font-size:13px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(79,220,155,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(79,220,155,0)}100%{box-shadow:0 0 0 0 rgba(79,220,155,0)}}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.acard{border-radius:18px;overflow:hidden;cursor:pointer;transition:.3s cubic-bezier(.2,.8,.2,1);position:relative}
.acard:hover{transform:translateY(-3px)}
.athumb{aspect-ratio:4/3;background:#0c0f18;position:relative;overflow:hidden}
.athumb img,.athumb video{width:100%;height:100%;object-fit:cover;display:block}
.athumb .mos{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);height:100%;gap:2px}
.athumb .mos img{object-fit:cover;height:100%}
.athumb .badge{position:absolute;left:10px;top:10px;display:flex;gap:6px}
.athumb .ty{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);color:#fff;border-radius:9px;padding:4px 8px;font-size:11px;font-weight:800;display:flex;gap:5px;align-items:center}
.athumb .ty svg{width:13px;height:13px}
.athumb .play{position:absolute;inset:0;display:grid;place-items:center}
.athumb .play span{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.22);backdrop-filter:blur(10px);display:grid;place-items:center;border:1px solid rgba(255,255,255,.35)}
.ainfo{padding:12px 14px}
.ainfo b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ainfo .row{margin-top:6px;gap:6px}
.new-flash{animation:flash 1.6s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--ok)}100%{box-shadow:var(--shadow)}}
.drop{border:1.5px dashed var(--stroke2);border-radius:18px;display:grid;place-items:center;text-align:center;padding:20px;color:var(--ink2);cursor:pointer;min-height:180px;transition:.2s}
.drop:hover,.drop.over{border-color:var(--acc);color:var(--ink);background:var(--glass)}
.drop svg{width:28px;height:28px;margin-bottom:6px}

/* lists */
.list{border-radius:var(--radius);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--stroke)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;font-size:13.5px}
.li .grow small{color:var(--ink3);font-size:12px}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--stroke2);display:grid;place-items:center;flex-shrink:0;transition:.15s}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk.on::after{content:'';width:6px;height:11px;border:solid #06210f;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.todo-done .grow b{text-decoration:line-through;color:var(--ink3)}
.thumbsm{width:46px;height:46px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#111}
.switch{width:42px;height:24px;border-radius:20px;background:var(--glass2);border:1px solid var(--stroke);position:relative;flex-shrink:0;transition:.2s}
.switch::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.switch.on{background:var(--ok);border-color:var(--ok)}
.switch.on::after{left:20px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}

/* viewer */
#viewer{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:rgba(5,7,12,.72);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px)}
body.light #viewer{background:rgba(230,234,242,.8)}
.vtop{display:flex;align-items:center;gap:10px;padding:calc(12px + var(--sat)) 16px 12px;border-bottom:1px solid var(--stroke)}
.vtop .ttl{min-width:0;flex:1}
.vtop .ttl b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.vtop .ttl small{color:var(--ink3);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbody{flex:1;display:flex;min-height:0}
.vstage{flex:1;display:flex;flex-direction:column;min-width:0;padding:16px;gap:12px}
.vmedia{flex:1;display:grid;place-items:center;min-height:0;position:relative}
.frame{position:relative;max-width:100%;max-height:100%;box-shadow:0 30px 80px rgba(0,0,0,.5);border-radius:6px;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none}
.frame>img,.frame>video,.frame>canvas{display:block;width:100%;height:100%;object-fit:contain}
.frame svg.ov{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50% 50% 50% 4px;background:var(--acc);color:#0b0d14;font-weight:800;font-size:12px;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.4);border:2px solid #fff;cursor:pointer;transition:transform .15s}
.pin:hover,.pin.hl{transform:scale(1.25)}
.pin.done{background:var(--ok)}
.wm{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center;overflow:hidden}
.wm span{transform:rotate(-24deg);font-weight:800;font-size:clamp(12px,2.4vw,22px);color:rgba(255,255,255,.16);white-space:nowrap;letter-spacing:.1em}
.tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
.tool{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--stroke)}
.tool.on{background:var(--acc);color:#0b0d14;border-color:var(--acc)}
.tool svg{width:18px;height:18px}
.colorpick{display:flex;gap:4px;margin:0 6px}
.colorpick button{width:20px;height:20px;border-radius:50%;border:2px solid transparent}
.colorpick button.on{border-color:var(--ink)}
.vctl{display:flex;align-items:center;gap:10px}
.scrub{flex:1;height:34px;position:relative;cursor:pointer;touch-action:none}
.scrub .tr{position:absolute;left:0;right:0;top:15px;height:5px;border-radius:5px;background:var(--glass2)}
.scrub .pr{position:absolute;left:0;top:15px;height:5px;border-radius:5px;background:var(--acc)}
.scrub .hd{position:absolute;top:10px;width:15px;height:15px;margin-left:-7px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.scrub .mk{position:absolute;top:2px;width:10px;height:10px;margin-left:-5px;border-radius:50% 50% 50% 2px;background:var(--warn);transform:rotate(-45deg)}
.scrub .mk.done{background:var(--ok)}
.tc{font-variant-numeric:tabular-nums;font-weight:700;font-size:12px;color:var(--ink2);min-width:92px;text-align:center}
.pages{display:flex;gap:8px;overflow-x:auto;padding:4px 2px;justify-content:center}
.pg{width:54px;flex-shrink:0;border-radius:6px;overflow:hidden;border:2px solid transparent;position:relative;opacity:.7;cursor:pointer}
.pg.on{border-color:var(--acc);opacity:1}
.pg img{width:100%;display:block}
.pg i{position:absolute;right:2px;top:2px;background:var(--warn);color:#000;font-style:normal;font-size:10px;font-weight:800;border-radius:6px;padding:0 4px}
.vside{width:360px;border-left:1px solid var(--stroke);display:flex;flex-direction:column;min-height:0}
.vtabs{display:flex;gap:4px;padding:10px 12px;border-bottom:1px solid var(--stroke)}
.vtabs .tab{flex:1;text-align:center;padding:8px 6px}
.vpanel{flex:1;overflow-y:auto;padding:12px}
.cmt{padding:12px;border-radius:14px;background:var(--glass);border:1px solid var(--stroke);margin-bottom:10px;cursor:pointer;transition:.15s}
.cmt:hover,.cmt.hl{border-color:var(--acc)}
.cmt .h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cmt .h .av{width:24px;height:24px;font-size:10px;border:0}
.cmt .h b{font-size:12.5px}
.cmt .h small{color:var(--ink3);font-size:11px;margin-left:auto}
.cmt p{margin:0;font-size:13px;line-height:1.45}
.cmt .ft{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--ink3)}
.num{width:20px;height:20px;border-radius:50% 50% 50% 3px;background:var(--acc);color:#0b0d14;display:inline-grid;place-items:center;font-size:10px;font-weight:800;flex-shrink:0}
.num.done{background:var(--ok)}
.compose{border-top:1px solid var(--stroke);padding:12px;padding-bottom:calc(12px + var(--sab))}
.compose textarea{width:100%;min-height:62px;resize:none;border-radius:13px;padding:11px 12px;background:var(--glass);border:1px solid var(--stroke);outline:none}
.compose textarea:focus{border-color:var(--acc)}
.hint{font-size:12px;color:var(--ink3);margin:6px 2px}
.vers{display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--glass)}
.vers button{padding:6px 10px;border-radius:9px;font-weight:800;font-size:12px;color:var(--ink2)}
.vers button.on{background:var(--ink);color:var(--bg)}
.cmp{position:absolute;inset:0;overflow:hidden}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.cmp .cut{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 10px rgba(0,0,0,.5)}
.cmp .cut::after{content:'⇆';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font-weight:800}
.cmp .lb{position:absolute;top:10px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px}
.validated{position:absolute;top:12px;left:12px;z-index:3}

/* ecom */
.etool{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--stroke)}
.egrid{flex:1;overflow-y:auto;padding:14px 16px calc(80px + var(--sab));display:grid;gap:10px;align-content:start;grid-auto-rows:max-content}
.eit{border-radius:12px;overflow:hidden;background:var(--glass);border:2px solid transparent;position:relative;cursor:pointer;}
.eit img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:#e9ebef}
.eit .ref{display:flex;align-items:center;justify-content:space-between;padding:5px 7px;font-size:10.5px;font-weight:700;color:var(--ink2)}
.eit .st{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900;color:#000}
.eit.sel{border-color:var(--acc)}
.eit.focus{outline:2px solid var(--ink);outline-offset:2px}
.eit .ck{position:absolute;top:6px;left:6px;width:20px;height:20px;border-radius:6px;background:rgba(0,0,0,.35);border:2px solid #fff;display:none}
.eselmode .eit .ck,.eit.sel .ck{display:block}
.eit.sel .ck{background:var(--acc);border-color:var(--acc)}
.eit .cm{position:absolute;left:6px;bottom:30px;background:var(--warn);color:#000;border-radius:7px;font-size:10px;font-weight:800;padding:1px 5px}
.bulk{position:absolute;left:50%;bottom:calc(18px + var(--sab));transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:18px;z-index:5;white-space:nowrap}
.loupe{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;background:rgba(5,7,12,.86);backdrop-filter:blur(20px)}
body.light .loupe{background:rgba(235,238,244,.92)}
.loupe .lm{flex:1;padding:16px;min-height:0;position:relative}
.loupe .lm img{position:absolute;inset:16px 70px;width:calc(100% - 140px);height:calc(100% - 32px);object-fit:contain;filter:drop-shadow(0 30px 60px rgba(0,0,0,.4))}
.loupe .nav2{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%}
.lbar{display:flex;gap:8px;justify-content:center;padding:12px;padding-bottom:calc(12px + var(--sab));flex-wrap:wrap;align-items:center}
.kbd{font-size:10px;font-weight:800;border:1px solid var(--stroke2);border-radius:5px;padding:0 5px;opacity:.7}

/* planning */
.gantt{border-radius:var(--radius);overflow:hidden}
.gh,.gr{display:grid;grid-template-columns:230px 1fr;border-bottom:1px solid var(--stroke)}
.gh{font-size:11px;color:var(--ink3);font-weight:700}
.gcell{padding:12px 14px;border-right:1px solid var(--stroke);min-width:0}
.gcell b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcell small{color:var(--ink3);font-size:11.5px}
.gtrack{position:relative;min-height:58px}
.gweeks{display:flex;height:100%}
.gweeks span{flex:1;border-right:1px dashed var(--stroke);padding:8px 6px;white-space:nowrap;overflow:hidden}
.gbar{position:absolute;top:50%;height:24px;margin-top:-12px;border-radius:8px;font-size:10.5px;font-weight:800;color:#0b0d14;padding:0 8px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:2}
.gtoday::after{content:"Aujourd'hui";position:absolute;top:2px;left:4px;font-size:9.5px;font-weight:800;color:var(--bad);white-space:nowrap}

/* modal & toast */
#modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(0,0,0,.45);padding:16px}
.mbox{width:min(520px,100%);max-height:88vh;overflow-y:auto;border-radius:24px;padding:22px;background:var(--glass2)}
body:not(.light) .mbox{background:rgba(22,26,38,.78)}
.mbox h3{margin:0 0 4px;font-size:19px}
.mail{border-radius:16px;background:#fff;color:#1a1d27;padding:18px;margin-top:14px;font-size:13px;line-height:1.5}
.mail .mh{font-size:11.5px;color:#677;border-bottom:1px solid #eee;padding-bottom:8px;margin-bottom:10px}
.mail .mbtn{display:inline-block;background:#141824;color:#fff;border-radius:10px;padding:9px 14px;font-weight:700;margin:8px 0}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + var(--sab));z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast svg{width:18px;height:18px;flex-shrink:0}
.toast{padding:12px 16px;border-radius:15px;font-weight:700;font-size:13px;animation:tin .35s cubic-bezier(.2,.8,.2,1);max-width:90vw;display:flex;gap:10px;align-items:center}
body:not(.light) .toast{background:rgba(22,26,38,.85)}
@keyframes tin{from{opacity:0;transform:translateY(12px) scale(.96)}}

/* login */
#login{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;overflow-y:auto}
.lbox{width:min(440px,100%);border-radius:28px;padding:30px}
.lbox h1{font-size:44px;margin:18px 0 6px}
.demo-users{display:grid;gap:8px;margin-top:10px}
.du{display:flex;align-items:center;gap:12px;padding:12px;border-radius:15px;background:var(--glass);border:1px solid var(--stroke);text-align:left;transition:.15s}
.du:hover{border-color:var(--acc)}
.du b{display:block;font-size:13.5px}.du small{color:var(--ink3);font-size:12px}
.sep{display:flex;align-items:center;gap:10px;color:var(--ink3);font-size:12px;margin:18px 0 6px}
.sep::before,.sep::after{content:'';flex:1;height:1px;background:var(--stroke)}
.strength{height:5px;border-radius:5px;background:var(--glass2);margin-top:8px;overflow:hidden}
.strength i{display:block;height:100%;transition:.3s}
.otp{display:flex;gap:8px;justify-content:center;margin-top:12px}
.otp input{width:44px;height:52px;text-align:center;font-size:20px;font-weight:800;border-radius:12px;background:var(--glass);border:1px solid var(--stroke);outline:none}

.seg{display:flex;gap:4px;padding:4px;border-radius:13px;background:var(--glass);flex-wrap:wrap}
.seg button{flex:1;padding:8px 10px;border-radius:10px;font-weight:700;font-size:12.5px;color:var(--ink2)}
.seg button.on{background:var(--ink);color:var(--bg)}
.swatch{width:52px;height:52px;border-radius:15px;border:2px solid transparent;position:relative;overflow:hidden}
.swatch.on{border-color:var(--ink)}
.empty{padding:40px 20px;text-align:center;color:var(--ink3)}


/* déclinaisons */
#studio{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;background:rgba(5,7,12,.8);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px)}
body.light #studio{background:rgba(230,234,242,.86)}
.dsbody{flex:1;display:flex;min-height:0}
.dspanel{width:440px;border-right:1px solid var(--stroke);display:flex;flex-direction:column;min-height:0;flex-shrink:0}
.dsp{flex:1;overflow-y:auto;padding:0 14px 30px}
.dsprev{flex:1;display:flex;flex-direction:column;gap:10px;padding:14px;min-width:0}
.dsstage{flex:1;display:grid;place-items:center;min-height:0}
.dsframe{position:relative;box-shadow:0 30px 80px rgba(0,0,0,.5);border-radius:6px;overflow:hidden;cursor:grab;touch-action:none;background:#000}
.dsframe canvas{width:100%;height:100%;display:block}
.dssafe{position:absolute;border:1.5px dashed rgba(255,255,255,.5);pointer-events:none;border-radius:4px}
.dseg{position:absolute;top:24px;height:4px;border-radius:2px;opacity:.9}
.dgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.dcard{border-radius:16px;overflow:hidden;cursor:pointer;transition:.2s}
.dcard:hover{transform:translateY(-2px)}
.dth{height:150px;display:grid;place-items:center;background:#05070c;position:relative}
.dth canvas{max-width:92%;max-height:132px;border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.dinf{padding:10px 12px}
.segc{width:10px;height:28px;border-radius:4px;flex-shrink:0}
table.mt{border-collapse:separate;border-spacing:4px;font-size:12px}
table.mt th{color:var(--ink3);font-weight:800}
.mcell{width:40px;height:28px;border-radius:7px;font-size:11px;font-weight:800}
.mcell.in{background:rgba(79,220,155,.22);color:var(--ok)}
.mcell.cut{background:rgba(255,195,90,.22);color:var(--warn)}
.mcell.out{background:var(--glass);color:var(--ink3)}
.mcell.forced{outline:2px solid var(--acc);outline-offset:-2px}
.dgrid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.dgrid2 label{font-size:11px;font-weight:700;color:var(--ink2);display:flex;flex-direction:column;gap:4px}
.dgrid2 .input{padding:7px 9px;font-size:12.5px}
.dspanel .tab{padding:8px 10px}
.trwrap{overflow:auto;border-radius:14px;max-height:58vh}
table.trt{border-collapse:collapse;font-size:12px}
.trt th{position:sticky;top:0;background:var(--bg);padding:8px;text-align:left;z-index:2;white-space:nowrap}
.trt td{padding:6px;vertical-align:top;border-top:1px solid var(--stroke)}
.trt td:first-child,.trt th:first-child{position:sticky;left:0;background:var(--bg);z-index:1;min-width:84px}
.trt th:first-child{z-index:3}
.trt textarea{min-width:190px;padding:7px 8px;font-size:12px;resize:vertical}
@media (max-width:900px){
  .dsbody{flex-direction:column-reverse}
  .dspanel{width:auto;border-right:0;border-top:1px solid var(--stroke);height:50%}
  .dsprev{padding:8px;gap:6px}
  .dsprev>.row{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start!important;padding-bottom:2px}
  .dgal{grid-template-columns:1fr 1fr;gap:8px}
  .dth{height:120px}.dth canvas{max-height:104px}
  #studio .vtop .seg{order:3}
}
@media (max-width:900px){
  #side{display:none}
  #main{padding:calc(14px + var(--sat)) 16px calc(96px + var(--sab))}
  #tabbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(10px + var(--sab));z-index:40;border-radius:22px;padding:6px;justify-content:space-around}
  #tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--ink3);padding:6px 8px;border-radius:14px;flex:1;position:relative}
  #tabbar button.on{color:var(--ink);background:var(--glass2)}
  #tabbar svg{width:21px;height:21px}
  #tabbar .cnt{position:absolute;top:2px;right:18%;font-size:9px;background:var(--acc);color:#000;border-radius:8px;padding:0 5px;font-weight:800}
  h1{font-size:32px}
  .grid,.agrid{grid-template-columns:1fr 1fr;gap:10px}
  .pcover{height:110px}
  .pbody{padding:10px 12px 12px}.pbody b{font-size:13.5px}
  .vbody{flex-direction:column}
  .vside{width:auto;border-left:0;border-top:1px solid var(--stroke);height:44%}
  .vstage{padding:10px;gap:8px}
  .vtop .hide-m,.etool .hide-m{display:none}
  .vtop{flex-wrap:wrap}
  .vtop .ttl{flex:1 1 calc(100% - 60px)}
  .loupe .lm img{inset:10px;width:calc(100% - 20px);height:calc(100% - 20px)}
  .gh,.gr{grid-template-columns:130px 1fr}
  .mob-only{display:initial}
  .lbox{padding:22px}
}
@media (max-width:520px){.grid{grid-template-columns:1fr}.agrid{grid-template-columns:1fr 1fr}.top{align-items:flex-start}}
@media (min-width:901px){.mob-only{display:none!important}}
</style>
</head>

<div id="bgfx"><div class="blob a"></div><div class="blob b"></div><div class="blob c"></div></div>
<div class="grain"></div>

<div id="login"></div>

  <aside id="side" class="glass"></aside>
  <main id="main"></main>

</div>

function vPlanning(){

}
function phaseCol(n){ if(n==='Validé')return 'var(--ok)'; if(/^Retours/.test(n))return 'var(--warn)'; if(/^V\d/.test(n))return 'var(--acc)'; return '#9aa3b5'; }
function gantt(list){
  const all=list.flatMap(p=>p.phases); if(!all.length) return '';
  let s=new Date(Math.min(...all.map(x=>+new Date(x.start)))), e=new Date(Math.max(...all.map(x=>+new Date(x.end))));
  s.setDate(s.getDate()-((s.getDay()+6)%7)); e.setDate(e.getDate()+7);
  const span=(e-s)||1, pos=d=>((new Date(d)-s)/span*100);
  const weeks=[]; for(let d=new Date(s);d<e;d.setDate(d.getDate()+7)) weeks.push(new Date(d));
  let h=`<div class="gantt glass"><div class="gh"><div class="gcell">Projet</div><div class="gtrack" style="min-height:0"><div class="gweeks">${weeks.map(w=>`<span>${fmtD(w)}</span>`).join('')}</div></div></div>`;
  list.forEach(p=>{ const c=client(p.clientId);
    h+=`<div class="gr"><div class="gcell" style="cursor:pointer" data-act="openProject" data-id="${p.id}"><b>${esc(p.name)}</b><small>${esc(c.name)} · ${p.closed?'<span style="color:var(--ok)">clôturé</span>':esc(p.phases[p.cur].name)}</small></div><div class="gtrack"><div class="gweeks">${weeks.map(()=>'<span></span>').join('')}</div>
    ${p.phases.map((ph,i)=>{const l=pos(ph.start),w=Math.max(pos(ph.end)-l+100/(span/864e5),1.2);return `<div class="gbar" title="${esc(ph.name)} · ${fmtD(ph.start)} → ${fmtD(ph.end)}" style="left:${l}%;width:${w}%;background:${phaseCol(ph.name)};opacity:${i<=p.cur||p.closed?1:.45}">${esc(ph.name)}</div>`}).join('')}
    <div class="gtoday" style="left:${pos(TODAY)}%"></div></div></div>`; });
  h+=`</div>`;
  if(list.length===1&&isTeam()&&!list[0].closed) h+=`<div class="row" style="margin-top:12px"><button class="btn sm" data-act="addVersionPhase" data-id="${list[0].id}">${I.plus}Ajouter une phase de version</button><button class="btn sm" data-act="nextPhase" data-id="${list[0].id}">Passer à la phase suivante →</button></div>`;
  return h;
}

/* =========================================================

   ========================================================= */
let V=null; // viewer state
function openAsset(id){
  const p=S.projects.find(p=>p.assets.some(a=>a.id===id)); const a=p.assets.find(a=>a.id===id);
  a.fresh=false;
  if(a.type==='ecom') return openEcom(p,a);
  V={p,a,ver:curVer(a),page:0,tool:'pin',color:'#ffc35a',draft:null,tab:'cmt',cmp:false,cmpX:.5,hl:null,playing:false};
  $('#viewer').classList.remove('hidden'); renderViewer();
}
function closeViewer(){ const vid=$('#vvid'); if(vid) vid.pause(); $('#viewer').classList.add('hidden'); $('#viewer').innerHTML=''; V=null; E=null; render(); }
function mediaRatio(a){ if(a.custom) return a.custom.ratio||1.5; return a.type==='video'?16/9:a.type==='pdf'?1/1.414:4/5; }
function mediaSrc(a,v,page){ if(a.custom) return a.custom.src; if(a.type==='campaign') return campaignImg(a.seed,v); if(a.type==='pdf') return a.custom?null:pdfPage(a.seed,page,v); return VID[((a.seed+v)%2)+1]; }
function anns(){ return V.a.annotations.filter(n=>n.ver===V.ver&&(V.a.type!=='pdf'||n.page===V.page)); }
function annIndex(n){ return V.a.annotations.filter(x=>x.ver===n.ver).indexOf(n)+1; }
function renderViewer(){
  const {p,a}=V, team=isTeam(), f=S.settings.features, canVal=f.validate&&(team||p.perm.validate), canDl=f.download&&S.settings.dl&&(team||p.perm.dl);
  const vers=a.versions.map(v=>`<button class="${v.v===V.ver?'on':''}" data-act="setVer" data-v="${v.v}">V${v.v}</button>`).join('');
  const isLast=V.ver===curVer(a);
  $('#viewer').innerHTML=`<div class="vtop"><button class="btn sm" data-act="closeViewer">${I.back}<span class="hide-m">Retour</span></button>
    <div class="ttl"><b>${esc(a.name)}</b><small>${esc(client(p.clientId).name)} · ${esc(p.name)}${team?` · <span style="color:var(--acc2)">Drive : ${esc(a.driveName)}</span>`:''}</small></div>
    <div class="vers">${vers}</div>
    ${f.compare&&a.versions.length>1&&a.type!=='video'&&!a.custom?`<button class="btn sm ${V.cmp?'pri':''}" data-act="toggleCmp" title="Comparer">${I.compare}<span class="hide-m">Comparer</span></button>`:''}
    ${team?`<button class="btn sm hide-m" data-act="newVersion">${I.up}Nouvelle version</button>`:''}${team&&(a.type==='campaign'||a.type==='video')?`<button class="btn sm" data-act="genFromAsset" title="Régénérer une version avec un modèle IA">✨<span class="hide-m">Régénérer</span></button>`:''}
    ${canDl?`<button class="btn sm" data-act="download" title="Télécharger">${I.down}</button>`:''}
    <button class="btn sm" data-act="copyLink" data-id="${p.id}" title="Copier le lien">${I.link}</button>
    ${canVal?(a.status==='validated'?`<span class="tag ok" style="padding:8px 10px">✓ Validé par ${esc(pname(a.validatedBy))}</span>`:`<button class="btn sm ok" data-act="validate" ${isLast?'':'disabled style="opacity:.4"'}>${I.check}<span class="hide-m">Valider V${curVer(a)}</span></button>`):''}
  </div>
  <div class="vbody"><div class="vstage"><div class="vmedia" id="vmedia"></div>${stageControls()}</div>
  <aside class="vside"><div class="vtabs"><button class="tab ${V.tab==='cmt'?'on':''}" data-act="vtab" data-t="cmt">Annotations <span class="muted">${anns().length}</span></button><button class="tab ${V.tab==='todo'?'on':''}" data-act="vtab" data-t="todo">À faire</button><button class="tab ${V.tab==='ver'?'on':''}" data-act="vtab" data-t="ver">Versions</button></div>
  <div class="vpanel" id="vpanel">${vPanel()}</div>
  ${V.tab==='cmt'?`<form class="compose" data-form="comment"><textarea name="t" placeholder="${V.draft?'Décrivez la correction…':(a.type==='video'?'Pause, puis cliquez sur l’image pour annoter…':'Cliquez sur l’image pour placer une annotation…')}" ${!isLast?'disabled':''}></textarea><div class="row" style="margin-top:8px"><span class="hint" style="margin:0;flex:1">${!isLast?'Ancienne version : lecture seule':V.draft?'<span style="color:var(--acc)">● Zone placée</span>'+(a.type==='video'?' à '+fmtT(V.draft.t):''):'Ou commentaire général'}</span><button class="btn sm pri" ${!isLast?'disabled':''}>${I.send}Publier</button></div></form>`:''}
  </aside></div>`;
  renderStage();
}
function stageControls(){
  const a=V.a, last=V.ver===curVer(a);
  const tools=last&&!V.cmp?`<div class="tools">${[['pin',I.pin,'Point'],['rect',I.rect,'Zone'],['draw',I.pen,'Dessin'],['arrow',I.arrow,'Flèche']].map(([k,i,l])=>`<button class="tool ${V.tool===k?'on':''}" data-act="setTool" data-v="${k}" title="${l}">${i}</button>`).join('')}<div class="colorpick">${['#ffc35a','#ff6b7a','#4fdc9b','#7cc4ff','#ffffff'].map(c=>`<button class="${V.color===c?'on':''}" style="background:${c}" data-act="setColor" data-v="${c}"></button>`).join('')}</div></div>`:'';
  if(a.type==='video') return `<div class="vctl"><button class="tool" data-act="vplay" id="vplayb">${I.play}</button><button class="tool" data-act="vstep" data-d="-1" title="Image précédente">‹</button><button class="tool" data-act="vstep" data-d="1" title="Image suivante">›</button><div class="scrub" id="scrub"><div class="tr"></div><div class="pr" id="spr"></div>${V.a.annotations.filter(n=>n.ver===V.ver&&n.t!=null).map(n=>`<div class="mk ${n.done?'done':''}" style="left:${0}%" data-t="${n.t}"></div>`).join('')}<div class="hd" id="shd"></div></div><span class="tc" id="vtc">00:00:00 / 00:00:00</span></div>${tools}`;
  if(a.type==='pdf') return `<div class="pages">${Array.from({length:a.pages},(_,i)=>{const c=a.annotations.filter(n=>n.ver===V.ver&&n.page===i&&!n.done).length;return `<div class="pg ${i===V.page?'on':''}" data-act="setPage" data-v="${i}"><img src="${a.custom?(a.custom.pages[i]||''):pdfPage(a.seed,i,V.ver,120)}" alt="">${c?`<i>${c}</i>`:''}</div>`}).join('')}</div>${tools}`;
  return tools;
}
function fitFrame(fr,ratio){ const box=$('#vmedia').getBoundingClientRect(); let w=box.width,h=w/ratio; if(h>box.height){h=box.height;w=h*ratio;} fr.style.width=w+'px'; fr.style.height=h+'px'; }
function renderStage(){
  const {a}=V, box=$('#vmedia'); const ratio=mediaRatio(a);
  const wm=!isTeam()&&S.settings.watermark?`<div class="wm"><span>${esc(client(V.p.clientId).name)} · ${esc(S.user.email)} · CONFIDENTIEL</span></div>`:'';
  if(V.cmp&&a.versions.length>1&&a.type!=='video'){
    const pv=Math.max(1,V.ver-1), cv=V.ver===1?2:V.ver; const src=v=>a.type==='pdf'?pdfPage(a.seed,V.page,v):campaignImg(a.seed,v);
    box.innerHTML=`<div class="frame" id="frame"><div class="cmp" id="cmp"><img src="${src(cv)}" alt=""><img src="${src(pv)}" alt="" style="clip-path:inset(0 ${100-V.cmpX*100}% 0 0)"><div class="cut" style="left:${V.cmpX*100}%"></div><span class="lb" style="left:10px">V${pv}</span><span class="lb" style="right:10px">V${cv}</span></div>${wm}</div>`;
    const fr=$('#frame'); fitFrame(fr,ratio);
    const mv=e=>{const r=fr.getBoundingClientRect();V.cmpX=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));fr.querySelector('.cmp img:nth-child(2)').style.clipPath=`inset(0 ${100-V.cmpX*100}% 0 0)`;fr.querySelector('.cut').style.left=V.cmpX*100+'%';};
    fr.addEventListener('pointerdown',e=>{fr.setPointerCapture(e.pointerId);mv(e);fr.onpointermove=mv;});fr.addEventListener('pointerup',()=>fr.onpointermove=null);
    return;
  }
  const media=a.type==='video'?`<video id="vvid" src="${mediaSrc(a,V.ver)}" playsinline preload="auto"></video>`:`<img src="${a.type==='pdf'&&a.custom?a.custom.pages[V.page]:mediaSrc(a,V.ver,V.page)}" alt="" draggable="false">`;
  box.innerHTML=`<div class="frame" id="frame">${a.status==='validated'&&V.ver===curVer(a)?'<span class="tag ok validated" style="background:var(--ok);color:#06210f">✓ VALIDÉ</span>':''}${media}<svg class="ov" id="ov" viewBox="0 0 1000 1000" preserveAspectRatio="none"></svg><div id="pins"></div>${wm}</div>`;
  fitFrame($('#frame'),ratio);
  if(a.type==='video') bindVideo();
  bindDraw(); drawAnns();
}
function visibleAnns(){ const list=anns().filter(n=>n.shape); if(V.a.type!=='video') return list; const t=$('#vvid')?$('#vvid').currentTime:0; return list.filter(n=>Math.abs(n.t-t)<0.6 || V.hl===n.id); }
function shapeSvg(s,col,hl){
  const W=1000; const st=`stroke="${col}" stroke-width="${hl?7:5}" fill="none" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"`;
  if(s.k==='rect') return `<rect x="${s.x*W}" y="${s.y*W}" width="${s.w*W}" height="${s.h*W}" rx="6" ${st} fill="${col}" fill-opacity=".12" style="stroke-width:${hl?4:2.5}px"/>`;
  if(s.k==='draw') return `<polyline points="${s.pts.map(p=>p[0]*W+','+p[1]*W).join(' ')}" ${st} style="stroke-width:${hl?5:3.5}px"/>`;
  if(s.k==='arrow'){ const [x1,y1,x2,y2]=[s.x*W,s.y*W,s.x2*W,s.y2*W]; return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${st} style="stroke-width:${hl?5:3.5}px"/><circle cx="${x2}" cy="${y2}" r="9" fill="${col}"/>`; }
  return '';
}
function anchor(s){ if(s.k==='pin') return [s.x,s.y]; if(s.k==='rect') return [s.x+s.w,s.y]; if(s.k==='draw') return s.pts[0]; if(s.k==='arrow') return [s.x,s.y]; return [.5,.5]; }
function drawAnns(){
  const ov=$('#ov'), pins=$('#pins'); if(!ov) return;
  let svg='',ph='';
  visibleAnns().forEach(n=>{ const col=n.color||'#ffc35a', hl=V.hl===n.id; svg+=shapeSvg(n.shape,n.done?'#4fdc9b':col,hl); const [x,y]=anchor(n.shape); ph+=`<div class="pin ${n.done?'done':''} ${hl?'hl':''}" style="left:${x*100}%;top:${y*100}%" data-act="hlAnn" data-n="${n.id}">${annIndex(n)}</div>`; });
  if(V.draft&&V.draft.shape){ svg+=shapeSvg(V.draft.shape,V.color,true); if(V.draft.shape.k==='pin'){const [x,y]=anchor(V.draft.shape);ph+=`<div class="pin" style="left:${x*100}%;top:${y*100}%;background:${V.color}">+</div>`;} }
  ov.innerHTML=svg; pins.innerHTML=ph;
}
function bindDraw(){
  const fr=$('#frame'); if(!fr) return;
  let start=null;
  const pt=e=>{const r=fr.getBoundingClientRect();return[Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))];};
  fr.addEventListener('pointerdown',e=>{
    if(e.target.closest('.pin')) return; if(V.ver!==curVer(V.a)) return toast('Ancienne version : passez à la dernière pour annoter');
    const vid=$('#vvid'); if(vid&&!vid.paused){vid.pause();syncPlayBtn();}
    fr.setPointerCapture(e.pointerId); start=pt(e); const t=vid?vid.currentTime:null;
    if(V.tool==='pin') V.draft={t,shape:{k:'pin',x:start[0],y:start[1]}};
    else if(V.tool==='rect') V.draft={t,shape:{k:'rect',x:start[0],y:start[1],w:0,h:0}};
    else if(V.tool==='draw') V.draft={t,shape:{k:'draw',pts:[start]}};
    else V.draft={t,shape:{k:'arrow',x:start[0],y:start[1],x2:start[0],y2:start[1]}};
    drawAnns();
  });
  fr.addEventListener('pointermove',e=>{ if(!start||!V.draft) return; const p=pt(e), s=V.draft.shape;
    if(s.k==='rect'){s.x=Math.min(start[0],p[0]);s.y=Math.min(start[1],p[1]);s.w=Math.abs(p[0]-start[0]);s.h=Math.abs(p[1]-start[1]);}
    else if(s.k==='draw') s.pts.push(p); else if(s.k==='arrow'){s.x2=p[0];s.y2=p[1];}
    drawAnns(); });
  fr.addEventListener('pointerup',()=>{ if(!start) return; start=null; const s=V.draft&&V.draft.shape;
    if(s&&s.k==='rect'&&(s.w<.02||s.h<.02)) V.draft.shape={k:'pin',x:s.x,y:s.y};
    if(s&&s.k==='draw'){ s.pts=s.pts.filter((p,i)=>i%2===0||i===s.pts.length-1); if(s.pts.length<3) V.draft.shape={k:'pin',x:s.pts[0][0],y:s.pts[0][1]}; }
    if(s&&s.k==='arrow'&&Math.hypot(s.x2-s.x,s.y2-s.y)<.03) V.draft.shape={k:'pin',x:s.x,y:s.y};
    drawAnns(); refreshCompose(); });
}
function refreshCompose(){ const ta=document.querySelector('.compose textarea'); if(!ta) return; ta.placeholder='Décrivez la correction…'; const hint=document.querySelector('.compose .hint'); if(hint) hint.innerHTML='<span style="color:var(--acc)">● Zone placée</span>'+(V.draft&&V.draft.t!=null?' à '+fmtT(V.draft.t):''); ta.focus({preventScroll:true}); }
function bindVideo(){
  const v=$('#vvid'), sc=$('#scrub');
  const upd=()=>{ const d=v.duration||8, t=v.currentTime; $('#spr').style.width=(t/d*100)+'%'; $('#shd').style.left=(t/d*100)+'%'; $('#vtc').textContent=fmtT(t)+' / '+fmtT(d); drawAnns(); };
  v.addEventListener('timeupdate',upd); v.addEventListener('loadedmetadata',()=>{ const d=v.duration||8; sc.querySelectorAll('.mk').forEach(m=>m.style.left=(m.dataset.t/d*100)+'%'); upd(); });
  v.addEventListener('ended',syncPlayBtn); v.addEventListener('pause',syncPlayBtn); v.addEventListener('play',syncPlayBtn);
  const seek=e=>{ const r=sc.getBoundingClientRect(); v.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*(v.duration||8); upd(); };
  sc.addEventListener('pointerdown',e=>{ sc.setPointerCapture(e.pointerId); seek(e); sc.onpointermove=seek; }); sc.addEventListener('pointerup',()=>sc.onpointermove=null);
}
function syncPlayBtn(){ const v=$('#vvid'),b=$('#vplayb'); if(v&&b) b.innerHTML=v.paused?I.play:I.pause; }
function vPanel(){

    const shown=a.type==='pdf'?all.slice().sort((x,y)=>x.page-y.page):all.slice().sort((x,y)=>(x.t??0)-(y.t??0));
    return shown.map(n=>`<div class="cmt ${V.hl===n.id?'hl':''}" data-act="hlAnn" data-n="${n.id}"><div class="h">${av(n.by)}<b>${esc(pname(n.by))}</b><small>${fmtD(n.date)}</small></div>
      <p><span class="num ${n.done?'done':''}">${annIndex(n)}</span> ${n.t!=null?`<span class="tag v">${fmtT(n.t)}</span> `:''}${n.page!=null?`<span class="tag v">p.${n.page+1}</span> `:''}${esc(n.text)}</p>
      <div class="ft"><button class="chk ${n.done?'on':''}" style="width:18px;height:18px" data-act="toggleTodo" data-a="${a.id}" data-n="${n.id}"></button><span>${n.done?'Corrigé':'À corriger'}</span><span style="margin-left:auto">→ ${esc(pname(n.to||a.uploader))}</span></div></div>`).join('');
  }
  if(V.tab==='todo'){ const items=a.annotations.map(n=>({p:V.p,a,n})); return todoList(items,true); }
  if(V.tab==='ver') return a.versions.slice().reverse().map(v=>`<div class="cmt ${v.v===V.ver?'hl':''}" data-act="setVer" data-v="${v.v}"><div class="h"><span class="tag v">V${v.v}</span><b>${esc(v.note)}</b><small>${fmtD(v.date)}</small></div><p class="muted" style="font-size:12px">Mise en ligne par ${esc(pname(v.by))} · ${a.annotations.filter(n=>n.ver===v.v).length} annotation(s)${v.v===curVer(a)&&a.status==='validated'?' · <b style="color:var(--ok)">validée</b>':''}</p></div>`).join('')+(team?`<button class="btn" style="width:100%;justify-content:center" data-act="newVersion">${I.up}Empiler une nouvelle version</button>`:'');
  return '';

function ecomNav(d){ const l=ecomFiltered(); let k=l.findIndex(x=>x.i===E.loupe); k=Math.max(0,Math.min(l.length-1,k+d)); E.loupe=l[k]?l[k].i:null; E.focus=k; }

  if(t.dataset.input==='pw'){ L.pw=t.value; const s=pwScore(L.pw),bar=document.querySelector('.strength i'); bar.style.width=s*25+'%'; bar.style.background=['var(--bad)','var(--bad)','var(--warn)','var(--acc)','var(--ok)'][s]; t.parentElement.querySelector('.hint').firstChild.textContent=['Trop court','Faible','Moyen','Bon','Excellent'][s]; }
  if(t.dataset.input==='esize'){ E.size=+t.value; $('#egrid').style.gridTemplateColumns=`repeat(auto-fill,minmax(${E.size}px,1fr))`; }

document.addEventListener('change',e=>{ const t=e.target;
  if(t.dataset.set){ S.settings[t.dataset.set]=t.dataset.set==='linkDays'?+t.value:t.value; applyLook(); toast('Réglage enregistré',I.check); }
  if(t.hasAttribute('data-assign')){ const a=S.projects.flatMap(p=>p.assets).find(a=>a.id===t.dataset.a); const n=a.annotations.find(n=>n.id===t.dataset.n); if(n){n.to=t.value;toast('Assigné à '+esc(pname(t.value)));} }
});
document.addEventListener('submit',e=>{ e.preventDefault(); const f=e.target, k=f.dataset.form;
  if(k==='login'){ const em=f.email.value.trim().toLowerCase(); const known=TEAM.some(t=>t.email===em)||S.clients.some(c=>c.contacts.some(x=>x.email===em)); if(!known) return toast('Adresse inconnue — demandez une invitation à M la créative'); L.email=em; if(S.settings.twofa&&!em.endsWith('@mlacreative.fr')){L.step='otp';renderLogin();} else login(em); }
  if(k==='setpw'){ if(pwScore(f.pw.value)<3) return toast('Mot de passe trop faible'); if(f.pw.value!==f.pw2.value) return toast('Les mots de passe ne correspondent pas'); const ct=S.clients[1].contacts[1]; ct.status='actif'; L.step='otp'; renderLogin(); }
  if(k==='otp'){ login(L.email); }
  if(k==='addContact'){ const em=f.email.value.trim().toLowerCase(); const p=proj(S.projectId), c=client(p.clientId); if(!c.contacts.some(x=>x.email===em)) c.contacts.push({email:em,name:em.split('@')[0],status:'invité'}); if(!p.members.includes(em)) p.members.push(em); render(); inviteModal(p,em); }
  if(k==='comment'){ const txt=f.t.value.trim(); if(!txt) return toast('Écrivez votre remarque'); const vid=$('#vvid');
    const n={id:uid('n'),ver:V.ver,text:txt,by:S.user.email,date:new Date().toISOString(),done:false,to:V.a.uploader,color:V.color,shape:V.draft?V.draft.shape:null};
    if(V.a.type==='video') n.t=V.draft?V.draft.t:(vid?vid.currentTime:0); if(V.a.type==='pdf') n.page=V.page;

});
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select')) { if(e.key==='Escape') e.target.blur(); return; }
  if(e.key==='Escape'){ if(!$('#modal').classList.contains('hidden')) return closeModal(); if(E&&E.loupe!=null){E.loupe=null;return renderEcom();} if(V||E) return closeViewer(); }
  if(E){ const l=ecomFiltered(); if(!l.length) return; const cols=Math.max(1,Math.floor(($('#egrid').clientWidth-32)/(E.size+10)));
    if(E.loupe!=null){ if(e.key==='ArrowRight'){ecomNav(1);renderEcom();} if(e.key==='ArrowLeft'){ecomNav(-1);renderEcom();} if(e.key===' '){e.preventDefault();E.loupe=null;renderEcom();} if('123'.includes(e.key)&&e.key!==''){ ACT.ecomSet({v:['ok','retouche','rejet'][+e.key-1]}); } return; }
    const mv={ArrowRight:1,ArrowLeft:-1,ArrowDown:cols,ArrowUp:-cols}[e.key];
    if(mv){ e.preventDefault(); E.focus=Math.max(0,Math.min(l.length-1,E.focus+mv)); renderEcom(); const el=document.querySelector('.eit.focus'); el&&el.scrollIntoView({block:'nearest'}); }
    if(e.key===' '){ e.preventDefault(); E.loupe=l[E.focus].i; renderEcom(); }
    if('123'.includes(e.key)&&e.key!==''){ ecomSet(l[E.focus].i,['ok','retouche','rejet'][+e.key-1]); E.focus=Math.min(l.length-1,E.focus+1); renderEcom(); const el=document.querySelector('.eit.focus'); el&&el.scrollIntoView({block:'nearest'}); }

async function importFiles(files){
  const p=proj(S.projectId); if(!p) return;
  for(const f of files){
    const url=URL.createObjectURL(f); const base=f.name.replace(/\.[^.]+$/,'');
    if(f.type.startsWith('image/')){ const img=new Image(); img.src=url; await img.decode().catch(()=>{}); const a=mkAsset('campaign',base,{uploader:S.user.email}); a.custom={src:url,thumb:url,ratio:(img.naturalWidth/img.naturalHeight)||.8}; a.fresh=true; a.driveName=f.name; p.assets.push(a); }
    else if(f.type.startsWith('video/')){ const a=mkAsset('video',base,{uploader:S.user.email}); a.custom={src:url,ratio:16/9}; const tv=document.createElement('video'); tv.src=url; await new Promise(r=>{tv.onloadedmetadata=r;tv.onerror=r;setTimeout(r,2500);}); if(tv.videoWidth) a.custom.ratio=tv.videoWidth/tv.videoHeight; a.fresh=true; a.driveName=f.name; p.assets.push(a); }
    else if(f.type==='application/pdf'){ try{ const pages=await renderPdf(f); const a=mkAsset('pdf',base,{uploader:S.user.email,pages:pages.urls.length}); a.custom={pages:pages.urls,thumb:pages.urls[0],ratio:pages.ratio}; a.fresh=true; a.driveName=f.name; p.assets.push(a);}catch(err){ toast('Lecture du PDF impossible dans l’aperçu'); continue; } }
    toast(`« ${esc(f.name)} » importé · créé dans le Drive du projet`,I.drive);
  }
  S.ptab='files'; render();
}
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function renderPdf(file){
  if(!window.pdfjsLib){ await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'); await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'); }
  const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise; const urls=[]; let ratio=.707;
  for(let i=1;i<=Math.min(doc.numPages,40);i++){ const pg=await doc.getPage(i); const vp=pg.getViewport({scale:1.4}); if(i===1) ratio=vp.width/vp.height; const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height; await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise; urls.push(c.toDataURL('image/jpeg',.85)); }
  return {urls,ratio};
}
// pdf custom: mediaSrc handles custom pages
const _ms=mediaSrc; mediaSrc=function(a,v,page){ if(a.custom&&a.type==='pdf') return a.custom.pages[page]; return _ms(a,v,page); };

/* ---------- montage auto : quels plans pour chaque durée ---------- */
function editList(DC,D){
  const segs=DC.segs.slice().sort((x,y)=>x.a-y.a), ov=DC.override[D]||{};
  let inc=segs.map(s=>({s,a:s.a,b:s.b}));
  const len=()=>inc.reduce((t,x)=>t+(x.b-x.a),0);
  if(D<DC.masterLen){
    // 1) retirer les plans les moins prioritaires (non forcés)
    const order=segs.filter(s=>ov[s.id]!==true&&s.pri>0).sort((x,y)=>y.pri-x.pri||(y.b-y.a)-(x.b-x.a));
    let removed=null;
    for(const s of order){ if(len()<=D) break; inc=inc.filter(x=>x.s!==s); removed=s; }
    segs.forEach(s=>{ if(ov[s.id]===false) inc=inc.filter(x=>x.s!==s); });
    // 2) trop court ? on réintègre une partie du dernier plan retiré
    if(len()<D-.2&&removed&&ov[removed.id]!==false){ const gap=D-len(), mid=(removed.a+removed.b)/2; inc.push({s:removed,a:mid-gap/2,b:mid+gap/2}); inc.sort((x,y)=>x.s.a-y.s.a); }
    // 3) encore trop long : on raccourcit (centre du plan), packshot préservé
    let over=len()-D;
    if(over>.05){ const flex=inc.filter(x=>x.s.pri>0); const room=flex.reduce((t,x)=>t+Math.max(0,(x.b-x.a)-1.2),0);
      if(room>0) flex.forEach(x=>{ const r=Math.max(0,(x.b-x.a)-1.2), cut=Math.min(r,over*r/room), m=(x.a+x.b)/2, half=((x.b-x.a)-cut)/2; x.a=m-half; x.b=m+half; });
      over=len()-D; if(over>.05){ const p=inc[inc.length-1]; p.a=Math.min(p.b-1,p.a+over); } }
  }
  let t=0; return inc.map(x=>{ const o={seg:x.s,a:x.a,b:x.b,o0:t,o1:t+(x.b-x.a)}; t=o.o1; return o; });
}

function outToMaster(EL,t){ for(const x of EL){ if(t<x.o1) return {seg:x.seg.id,time:x.a+(t-x.o0)}; } const l=EL[EL.length-1]; return {seg:l.seg.id,time:l.b-.04}; }

/* ---------- rendu image ---------- */
function drawSource(ctx,src,W,H,fmt){
  const sw=src.videoWidth||src.width||640, sh=src.videoHeight||src.height||360; if(!sw) return;
  const cover=(fx,fy)=>{ const sc=Math.max(W/sw,H/sh), cw=W/sc, ch=H/sc; const sx=Math.max(0,Math.min(sw-cw,fx*sw-cw/2)), sy=Math.max(0,Math.min(sh-ch,fy*sh-ch/2)); ctx.drawImage(src,sx,sy,cw,ch,0,0,W,H); };
  if(fmt.fit==='blur'){ ctx.save(); try{ctx.filter='blur(18px) brightness(.55)';}catch(e){} cover(.5,.5); ctx.restore(); if(!('filter' in ctx)){ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,W,H);} const sc=Math.min(W/sw,H/sh), dw=sw*sc, dh=sh*sc; ctx.drawImage(src,(W-dw)/2,(H-dh)/2,dw,dh); }
  else cover(fmt.fx,fmt.fy);
}
function wrap(ctx,txt,maxW){ const words=txt.split(' '), lines=[]; let cur=''; words.forEach(w=>{ const t=cur?cur+' '+w:w; if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;} else cur=t; }); if(cur) lines.push(cur); return lines; }
function fillVars(DC,s){ return s.replace(/\{(\w+)\}/g,(m,k)=>DC.vars[k]||m); }
function safeBox(fmt,W,H){ // zone de sécurité (UI des réseaux sociaux)
  if(fmt.k==='9x16') return {x:W*.06,y:H*.13,w:W*.76,h:H*.62};
  if(fmt.k==='4x5'||fmt.k==='1x1') return {x:W*.06,y:H*.06,w:W*.88,h:H*.86};
  return {x:W*.05,y:H*.07,w:W*.9,h:H*.84};
}
function easeOut(x){return 1-Math.pow(1-Math.min(1,Math.max(0,x)),3);}
function drawText(ctx,DC,tx,lang,W,H,fmt,lt,life,bandH){
  const raw=(tx.tr[lang]||tx.tr.FR||''); if(!raw) return;
  const sb=safeBox(fmt,W,H), base=Math.min(W,H)*.075*tx.size*(W/H>2.2?1.25:1);
  ctx.font=`800 ${base}px Manrope, system-ui, sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
  const lines=wrap(ctx,raw,sb.w*.92), lh=base*1.15, bh=lines.length*lh;
  let cy=tx.pos==='haut'?sb.y+bh/2+base*.3:tx.pos==='centre'?H/2:Math.min(sb.y+sb.h,H-bandH-base*.6)-bh/2;
  const inT=Math.min(.45,life/3), outT=.3, p=easeOut(lt/inT), q=lt>life-outT?Math.max(0,(life-lt)/outT):1;
  let alpha=q, dy=0, sc=1, chars=Infinity, clip=1, dx=0;
  const A=tx.anim;
  if(A==='fondu') alpha*=p; else if(A==='montee'){alpha*=p;dy=(1-p)*base*.9;} else if(A==='zoom'){alpha*=p;sc=.6+.4*easeOut(lt/inT*1.1)+(p<1?.06*Math.sin(p*Math.PI):0);}
  else if(A==='machine'){chars=Math.floor(raw.length*Math.min(1,lt/(Math.min(life*.5,raw.length*.05))));} else if(A==='masque'){clip=p;} else if(A==='glisse'){alpha*=p;dx=-(1-p)*W*.3;}
  else if(A&&A.startsWith('kf:')){ const ca=DC.customAnims.find(c=>c.id===A.slice(3)); if(ca){ const k=kfAt(ca.data.in||[],lt); alpha*=k.opacity??1; dy=(k.y||0)*base/40; sc=k.scale??1; dx=(k.x||0)*base/40; } }
  ctx.save(); ctx.globalAlpha=Math.max(0,Math.min(1,alpha)); ctx.translate(W/2+dx,cy+dy); ctx.scale(sc,sc);
  if(clip<1){ ctx.beginPath(); ctx.rect(-W/2,bh/2-bh*clip-4,W,bh*clip+8); ctx.clip(); }
  ctx.shadowColor='rgba(0,0,0,.45)'; ctx.shadowBlur=base*.35; ctx.fillStyle='#fff';
  let left=chars; lines.forEach((l,i)=>{ const s=left>=l.length?l:l.slice(0,Math.max(0,left)); left-=l.length+1; ctx.fillText(s,0,-bh/2+lh*(i+.5)+ (clip<1?(1-clip)*bh*.4:0)); });
  ctx.restore();
}
function kfAt(kfs,t){ if(!kfs.length) return {}; if(t<=kfs[0].t) return kfs[0]; for(let i=1;i<kfs.length;i++){ const a=kfs[i-1],b=kfs[i]; if(t<=b.t){ const u=(t-a.t)/(b.t-a.t||1), o={}; ['opacity','x','y','scale'].forEach(k=>{ const va=a[k]??(k==='opacity'||k==='scale'?1:0), vb=b[k]??(k==='opacity'||k==='scale'?1:0); o[k]=va+(vb-va)*easeOut(u); }); return o; } } return kfs[kfs.length-1]; }
function drawFrame(ctx,W,H,DC,cfg,t,src){
  const fmt=fmtOf(DC,cfg.f), EL=editList(DC,cfg.d), D=outDur(EL);
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  if(src) drawSource(ctx,src,W,H,fmt);
  // mentions légales
  let bandH=0; const big=Math.min(W,H)>420; const fs=Math.max(big?9:0,Math.min(W,H)*.026);
  DC.legal.forEach(lg=>{ const txt=fillVars(DC,lg.tr[cfg.l]||lg.tr.FR||''); if(!txt) return; const last=EL[EL.length-1];
    if(lg.mode==='fin'&&t<last.o0) return;
    ctx.font=`600 ${fs}px Manrope, system-ui, sans-serif`; const lines=wrap(ctx,txt,W*.9); const h=lines.length*fs*1.25+fs*.9;
    const y=H-bandH-h; ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(0,y,W,h); ctx.fillStyle='rgba(255,255,255,.92)'; ctx.textAlign='center'; ctx.textBaseline='middle';
    lines.forEach((l,i)=>ctx.fillText(l,W/2,y+fs*.45+fs*1.25*(i+.5))); bandH+=h; });
  // sous-titres de la voix off (formats réseaux sociaux, lecture sans le son)
  if(DC.subs[cfg.f]&&DC.vo) DC.vo.lines.forEach(ln=>{ const w=voLine(DC,EL,ln); if(!w||t<w.o0||t>w.o1) return; const txt=ln.tr[cfg.l]||''; if(!txt) return; const sfs=Math.max(big?10:0,Math.min(W,H)*.042);
    ctx.font=`700 ${sfs}px Manrope, system-ui, sans-serif`; const lines=wrap(ctx,txt,W*.8), sb=safeBox(fmt,W,H); let y=Math.min(sb.y+sb.h,H-bandH-sfs*.6)-lines.length*sfs*1.3;
    ctx.textAlign='center'; ctx.textBaseline='middle'; lines.forEach(l=>{ const tw=ctx.measureText(l).width; ctx.fillStyle='rgba(0,0,0,.62)'; ctx.fillRect(W/2-tw/2-sfs*.4,y,tw+sfs*.8,sfs*1.3); ctx.fillStyle='#ffe066'; ctx.fillText(l,W/2,y+sfs*.66); y+=sfs*1.32; }); bandH+=lines.length*sfs*1.35+sfs*.4; });
  // textes animés, accrochés à leur plan
  DC.texts.forEach(tx=>{ let e=EL.find(x=>x.seg.id===tx.seg); if(!e){ const pool=EL.filter(x=>x.seg.pri>0); e=pool.sort((x,y)=>x.seg.pri-y.seg.pri)[0]||EL[0]; }
    const segLen=e.o1-e.o0, off=Math.min(tx.off,Math.max(0,segLen-1)), life=Math.min(tx.dur,segLen-off), lt=t-(e.o0+off);
    if(lt>=0&&lt<=life) drawText(ctx,DC,tx,cfg.l,W,H,fmt,lt,life,bandH); });
  // animations Lottie importées (calques graphiques)
  DC.customAnims.filter(c=>c.type==='lottie'&&c.on&&c.inst).forEach(c=>{ try{ const fr=Math.floor((t%(c.inst.totalFrames/ (c.inst.frameRate||25)))*(c.inst.frameRate||25)); c.inst.goToAndStop(fr,true); const sz=Math.min(W,H)*.28; ctx.drawImage(c.cv,W-sz-W*.04,H*.05,sz,sz); }catch(e){} });
  return D;
}

/* ---------- frames du master en cache (vignettes) ---------- */
const MF={ready:false,frames:{}};
function masterVideo(){ let v=document.getElementById('dsMaster'); if(!v){ v=document.createElement('video'); v.id='dsMaster'; v.muted=true; v.playsInline=true; v.preload='auto'; v.src=VID.master; v.style.cssText='position:fixed;width:2px;height:2px;opacity:0;pointer-events:none;left:-10px'; document.body.appendChild(v);} return v; }
function seekTo(v,t){ return new Promise(r=>{ if(Math.abs(v.currentTime-t)<.01&&v.readyState>=2) return r(); const done=()=>{v.removeEventListener('seeked',done);r();}; v.addEventListener('seeked',done); v.currentTime=t; setTimeout(r,1500); }); }
async function cacheFrames(DC){
  if(MF.ready) return; const v=masterVideo(); if(v.readyState<1) await new Promise(r=>{v.addEventListener('loadedmetadata',r,{once:true});setTimeout(r,3000);});
  for(const s of DC.segs){ for(const k of [0,1,2]){ const t=s.a+(s.b-s.a)*(.2+.3*k); await seekTo(v,t); const c=document.createElement('canvas'); c.width=320; c.height=180; c.getContext('2d').drawImage(v,0,0,320,180); (MF.frames[s.id]=MF.frames[s.id]||[]).push({t,c}); } }
  MF.ready=true;
}
function frameFor(DC,cfg,t){ const EL=editList(DC,cfg.d), m=outToMaster(EL,t), fr=MF.frames[m.seg]; if(!fr) return null; return fr.reduce((b,x)=>Math.abs(x.t-m.time)<Math.abs(b.t-m.time)?x:b).c; }

const fmtS=t=>`${String(Math.floor(t/60)).padStart(2,'0')}:${String(Math.floor(t%60)).padStart(2,'0')}`;

/* ---------- aperçu live ---------- */
function setupPreview(){
  const {DC}=DS, fmt=fmtOf(DC,DC.sel.f)||DC.formats.find(f=>f.on); if(!fmt) return; DC.sel.f=fmt.k;
  const st=document.getElementById('dsstage'), fr=document.getElementById('dsframe'), cv=document.getElementById('dscv');
  const box=st.getBoundingClientRect(), r=fmt.w/fmt.h; let w=box.width, h=w/r; if(h>box.height){h=box.height;w=h*r;}
  fr.style.width=w+'px'; fr.style.height=h+'px'; const dpr=Math.min(2,devicePixelRatio||1); cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  const sb=safeBox(fmt,cv.width,cv.height), sf=document.getElementById('dssafe'); sf.style.cssText=`left:${sb.x/cv.width*100}%;top:${sb.y/cv.height*100}%;width:${sb.w/cv.width*100}%;height:${sb.h/cv.height*100}%;display:${DS.safe?'block':'none'}`;
  const EL=editList(DC,DC.sel.d), D=outDur(EL); DS.D=D; DS.EL=EL; DS.t=Math.min(DS.t,D-.05);
  document.getElementById('dssegs').innerHTML=EL.map(x=>`<span class="dseg" style="left:${x.o0/D*100}%;width:${(x.o1-x.o0)/D*100}%;background:${segCol(x.seg)}"></span>`).join('');
  const sc=document.getElementById('dsscrub'); const seek=e=>{const rr=sc.getBoundingClientRect(); DS.t=Math.max(0,Math.min(D-.05,(e.clientX-rr.left)/rr.width*D)); dsDraw(true);};
  sc.onpointerdown=e=>{sc.setPointerCapture(e.pointerId);seek(e);sc.onpointermove=seek;}; sc.onpointerup=()=>sc.onpointermove=null;
  // recadrage à la souris / au doigt
  let drag=null; fr.onpointerdown=e=>{ if(fmt.fit==='blur') return toast('Format en fond flouté : passez en « Recadré » pour cadrer'); fr.setPointerCapture(e.pointerId); drag={x:e.clientX,y:e.clientY,fx:fmt.fx,fy:fmt.fy}; };
  fr.onpointermove=e=>{ if(!drag) return; const k=1.6; fmt.fx=Math.max(0,Math.min(1,drag.fx-(e.clientX-drag.x)/w/k)); fmt.fy=Math.max(0,Math.min(1,drag.fy-(e.clientY-drag.y)/h/k)); dsDraw(true); };
  fr.onpointerup=()=>{ if(drag&&(drag.fx!==fmt.fx||drag.fy!==fmt.fy)) markOld(o=>o.f===fmt.k,'Cadrage '+fmt.k); drag=null; };
  cacheFrames(DC).then(()=>dsDraw(true));
}
function dsDraw(seek){
  if(!DS||DS.mode!=='edit') return; const cv=document.getElementById('dscv'); if(!cv) return; const {DC}=DS, cfg=DC.sel, v=masterVideo();
  const m=outToMaster(DS.EL,DS.t);
  let src=null;
  if(DS.playing){ if(Math.abs(v.currentTime-m.time)>.25){ v.currentTime=m.time; } src=v.readyState>=2?v:frameFor(DC,cfg,DS.t); }
  else { src=frameFor(DC,cfg,DS.t); if(seek){ clearTimeout(DS.sk); DS.sk=setTimeout(()=>seekTo(v,m.time).then(()=>{ if(DS&&!DS.playing){ drawFrame(cv.getContext('2d'),cv.width,cv.height,DC,cfg,DS.t,v); } }),60); } }
  drawFrame(cv.getContext('2d'),cv.width,cv.height,DC,cfg,DS.t,src);
  const pc=DS.t/DS.D*100; document.getElementById('dspr').style.width=pc+'%'; document.getElementById('dshd').style.left=pc+'%'; document.getElementById('dstc').textContent=fmtS(DS.t)+' / '+fmtS(DS.D);
}
function dsLoop(now){ if(!DS||!DS.playing) return; const dt=Math.min(.1,(now-(DS.last||now))/1000); DS.last=now; const t0=DS.t; DS.t+=dt;
  if(DS.speak){ DS.spoken=DS.spoken||new Set(); DS.DC.vo.lines.forEach(ln=>{ const w=voLine(DS.DC,DS.EL,ln); if(w&&t0<w.o0&&DS.t>=w.o0) sayLang(DS.DC.sel.l,ln.tr[DS.DC.sel.l]||''); }); } if(DS.t>=DS.D){ if(DS.rec){ DS.t=DS.D-.01; dsDraw(); return finishRec(); } DS.t=0; } dsDraw(); DS.raf=requestAnimationFrame(dsLoop); }
function dsPlay(){ if(!DS) return; DS.playing=true; DS.last=0; const v=masterVideo(); v.currentTime=outToMaster(DS.EL,DS.t).time; v.play().catch(()=>{}); DS.raf=requestAnimationFrame(dsLoop); const b=document.getElementById('dspb'); if(b) b.innerHTML=I.pause; }
function dsStop(){ if(!DS) return; DS.playing=false; cancelAnimationFrame(DS.raf); masterVideo().pause(); const b=document.getElementById('dspb'); if(b) b.innerHTML=I.play; }
function markOld(fn,why){ const {p,DC}=DS||{p:proj(S.projectId),DC:proj(S.projectId).decli}; let n=0; deliverables(DC).forEach(o=>{ if(fn(o)){ const s=DC.outputs[o.key]||(DC.outputs[o.key]={}); if(s.st!=='old'){s.st='old';s.valid=false;s.real=null;n++;} } }); if(n&&why) toast(`${why} → ${n} vidéo(s) à régénérer`); if(DS) refreshTop(); }
function refreshTop(){ if(!DS) return; const all=deliverables(DS.DC), old=all.filter(o=>(DS.DC.outputs[o.key]||{}).st!=='ok').length; const b=document.querySelector('#studio [data-act=dsRegen] span'); if(b&&!DS.rendering) b.textContent=old?`Régénérer tout (${old})`:'Tout est à jour'; }

/* ---------- rendu réel (navigateur) ---------- */
function dsRenderReal(){
  const cv=document.getElementById('dscv'); if(!cv||!cv.captureStream||!window.MediaRecorder) return toast('Rendu réel indisponible sur ce navigateur');
  const types=['video/mp4;codecs=avc1','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm']; const mt=types.find(t=>MediaRecorder.isTypeSupported(t))||'';
  const rec=new MediaRecorder(cv.captureStream(30),mt?{mimeType:mt,videoBitsPerSecond:4e6}:undefined); const chunks=[]; rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{ const blob=new Blob(chunks,{type:rec.mimeType||'video/webm'}); const key=`${DS.DC.sel.l}_${DS.DC.sel.d}_${DS.DC.sel.f}`; const o=DS.DC.outputs[key]||(DS.DC.outputs[key]={}); o.real=URL.createObjectURL(blob); o.st='ok'; o.ver=DS.DC.masterVer; DS.rec=null; toast(`Vidéo rendue (${(blob.size/1e6).toFixed(1)} Mo, ${mt.includes('mp4')?'MP4':'WebM'}) — visible dans « Vidéos »`,I.check); renderStudio(); };
  dsStop(); DS.t=0; DS.rec=rec; rec.start(250); toast(`Rendu réel en cours (${Math.round(DS.D)} s)…`); dsPlay();
}

/* ---------- analyse de l'image : où est le sujet ? ---------- */
async function analyzeMaster(DC,onProg){
  if(DC.track||DC.analyzing) return; DC.analyzing=true;
  const v=masterVideo(); if(v.readyState<1) await new Promise(r=>{v.addEventListener('loadedmetadata',r,{once:true});setTimeout(r,3000);});
  const c=document.createElement('canvas'); c.width=64; c.height=36; const x=c.getContext('2d',{willReadFrequently:true});
  const tr=[]; let prev=null; const step=.5, N=Math.ceil(DC.masterLen/step);
  for(let i=0;i<N;i++){ const t=Math.min(DC.masterLen-.05,.1+i*step); await seekTo(v,t); x.drawImage(v,0,0,64,36); let d; try{ d=x.getImageData(0,0,64,36).data; }catch(e){ break; }
    const L=new Float32Array(64*36); for(let k=0;k<L.length;k++) L[k]=.299*d[k*4]+.587*d[k*4+1]+.114*d[k*4+2];
    const seg=DC.segs.find(s=>t>=s.a&&t<s.b); const cut=prev&&prev.seg!==seg;
    let S=0,sx=0,sy=0; const w=new Float32Array(L.length); let MT=0; if(prev&&!cut) for(let k=0;k<L.length;k++) MT+=Math.abs(L[k]-prev.L[k]); let MC=0; if(prev&&!cut) for(let k=0;k<L.length;k++) if(Math.abs(L[k]-prev.L[k])>14) MC++; const useMot=MC>20;
    for(let yy=1;yy<35;yy++) for(let xx=1;xx<63;xx++){ const k=yy*64+xx; const edge=Math.abs(L[k]-L[k+1])+Math.abs(L[k]-L[k+64]); const mot=prev&&!cut?Math.abs(L[k]-prev.L[k]):0; const zone=(yy<4||yy>26)?.08:1; /* bandes haute et basse : incrustations ignorées */ const s=zone*Math.pow(Math.max(0,edge-6),1.5); w[k]=s; S+=s; sx+=s*xx; sy+=s*yy; }
    const cx=S?sx/S:32, cy=S?sy/S:18; let vx=0; if(S) for(let k=0;k<L.length;k++){ if(w[k]) vx+=w[k]*Math.pow(k%64-cx,2); }
    tr.push({t,x:cx/64,y:cy/36,sx:S?Math.sqrt(vx/S)/64:.2,seg:seg?seg.id:null,mc:MC,um:useMot}); prev={L,seg};
    DC.anaP=(i+1)/N; onProg&&onProg(DC.anaP);
  }
  // lissage (sans traverser les coupes)
  const sm=tr.map((p,i)=>{ const nb=tr.slice(Math.max(0,i-2),i+3).filter(q=>q.seg===p.seg); return {...p,x:nb.reduce((a,q)=>a+q.x,0)/nb.length,y:nb.reduce((a,q)=>a+q.y,0)/nb.length}; });
  DC.track=sm; DC.analyzing=false;
  DC.segs.forEach(s=>{ const pts=sm.filter(p=>p.seg===s.id); if(!pts.length) return; const mx=pts.reduce((a,p)=>a+p.x,0)/pts.length; s.ana={mx,my:pts.reduce((a,p)=>a+p.y,0)/pts.length,spread:pts.reduce((a,p)=>a+p.sx,0)/pts.length,move:Math.sqrt(pts.reduce((a,p)=>a+Math.pow(p.x-mx,2),0)/pts.length)}; });
}

/* ---------- rendu image (remplace la version précédente) ---------- */
drawSource=function(ctx,src,W,H,fmt,DC,segId,mt,preview){

  const cover=(sc,cx,cy)=>{ const cw=W/sc, ch=H/sc; const sx=Math.max(0,Math.min(sw-cw,cx*sw-cw/2)), sy=Math.max(0,Math.min(sh-ch,cy*sh-ch/2)); ctx.drawImage(src,sx,sy,cw,ch,0,0,W,H); };
  const scCover=Math.max(W/sw,H/sh), scFit=Math.min(W/sw,H/sh);
  if(mode==='blur'||mode==='extend'){
    // fond : image étirée et adoucie (dans la version en ligne : zones générées par IA)
    ctx.save(); try{ ctx.filter=mode==='blur'?'blur(18px) brightness(.55)':'blur(10px) saturate(1.15) brightness(.95)'; }catch(e){} cover(scCover,fx,fy); ctx.restore();
    const sc=mode==='blur'?scFit:scFit+(scCover-scFit)*(rf.zoom??.35); const dw=sw*sc, dh=sh*sc;
    let dx=W/2-fx*dw, dy=H/2-fy*dh; dx=Math.min(0,Math.max(W-dw,dx)); if(dw<W) dx=(W-dw)/2; dy=Math.min(0,Math.max(H-dh,dy)); if(dh<H) dy=(H-dh)/2;
    ctx.drawImage(src,dx,dy,dw,dh);
    if(mode==='extend'){ // fondu doux entre image d'origine et zones étendues
      const f=Math.min(W,H)*.06; [[dx,dy,dw,f,0,1],[dx,dy+dh-f,dw,f,0,-1]].forEach(([x,y,w,h,_,dir])=>{ if(dh>=H-1) return; const g=ctx.createLinearGradient(0,y,0,y+h); g.addColorStop(dir>0?0:1,'rgba(0,0,0,0)'); ctx.save(); ctx.globalAlpha=.0; ctx.restore(); });
      if(preview){ ctx.save(); ctx.strokeStyle='rgba(178,140,255,.85)'; ctx.setLineDash([6,5]); ctx.lineWidth=1.5; ctx.strokeRect(dx+1,dy+1,dw-2,dh-2); ctx.restore(); ctx.fillStyle='rgba(178,140,255,.9)'; ctx.font=`800 ${Math.max(10,Math.min(W,H)*.03)}px Manrope`; ctx.textAlign='left'; ctx.textBaseline='top'; ctx.fillText('✨ zones étendues par IA',8,8); }
    }
    return;
  }
  cover(scCover,fx,fy);
};

    else { for(let ci=0;ci<ln.length;ci++){ const ch=ln[ci]; if(ch===' ') continue; units.push({t:ch,x:x0+ctx.measureText(ln.slice(0,ci)).width,y,w:ctx.measureText(ch).width,line:li}); } }
    lines[li]={t:ln,w:lw,x:x0,y}; });

function drawUnit(ctx,u,fx,outA,tx,font,lh){

function paintRfThumbs(){
  if(!DS||DS.panel!=='cadrage') return; const {DC}=DS, fmt=fmtOf(DC,DC.sel.f);
  document.querySelectorAll('canvas[data-rf]').forEach(c=>{ const s=segOf(DC,c.dataset.rf), fr=(MF.frames[s.id]||[])[1]; const x=c.getContext('2d'); x.fillStyle='#000'; x.fillRect(0,0,c.width,c.height); if(!fr) return;
    x.drawImage(fr.c,0,0,c.width,c.height); const rf=rfOf(DC,fmt,s.id), mt=(s.a+s.b)/2, cf=cropFrac(fmt); let fx=.5,fy=.5;
    if(rf.mode==='track'||rf.mode==='extend'){ const p=trackAt(DC,mt); fx=p.x; fy=p.y; } else if(rf.mode==='manual'){ fx=rf.fx; fy=rf.fy; }
    // trajectoire du sujet
    x.strokeStyle='rgba(255,224,102,.9)'; x.lineWidth=1.5; x.beginPath(); (DC.track||[]).filter(p=>p.seg===s.id).forEach((p,i)=>{ const px=p.x*c.width, py=p.y*c.height; i?x.lineTo(px,py):x.moveTo(px,py); }); x.stroke();
    let w=cf.w, h=cf.h; if(rf.mode==='extend'){ const k=1/(1+(1/cf.w-1)*(rf.zoom??.35)); w=Math.min(1,cf.w/k); h=Math.min(1,cf.h/k); } if(rf.mode==='blur'){ w=1; h=1; }
    const x0=Math.max(0,Math.min(1-w,fx-w/2)), y0=Math.max(0,Math.min(1-h,fy-h/2));
    x.fillStyle='rgba(0,0,0,.55)'; x.fillRect(0,0,c.width,y0*c.height); x.fillRect(0,(y0+h)*c.height,c.width,c.height); x.fillRect(0,y0*c.height,x0*c.width,h*c.height); x.fillRect((x0+w)*c.width,y0*c.height,c.width,h*c.height);
    x.strokeStyle=rf.mode==='extend'?'#b28cff':'#7cc4ff'; x.lineWidth=2; x.strokeRect(x0*c.width+1,y0*c.height+1,w*c.width-2,h*c.height-2);
    if(rf.mode==='extend'){ x.fillStyle='#b28cff'; x.font='800 10px Manrope'; x.fillText('✨ + IA',x0*c.width+4,y0*c.height+12); } });
}

/* ---------- aperçu : glisser = recadrer le plan courant ---------- */
setupPreview=function(){
  const {DC}=DS, fmt=fmtOf(DC,DC.sel.f)||DC.formats.find(f=>f.on); if(!fmt) return; DC.sel.f=fmt.k;
  const st=document.getElementById('dsstage'), fr=document.getElementById('dsframe'), cv=document.getElementById('dscv');
  const box=st.getBoundingClientRect(), r=fmt.w/fmt.h; let w=box.width, h=w/r; if(h>box.height){h=box.height;w=h*r;}
  fr.style.width=w+'px'; fr.style.height=h+'px'; const dpr=Math.min(2,devicePixelRatio||1); cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  const sb=safeBox(fmt,cv.width,cv.height), sf=document.getElementById('dssafe'); sf.style.cssText=`left:${sb.x/cv.width*100}%;top:${sb.y/cv.height*100}%;width:${sb.w/cv.width*100}%;height:${sb.h/cv.height*100}%;display:${DS.safe?'block':'none'}`;
  const EL=editList(DC,DC.sel.d), D=outDur(EL); DS.D=D; DS.EL=EL; DS.t=Math.min(DS.t,D-.05);
  document.getElementById('dssegs').innerHTML=EL.map(x=>`<span class="dseg" style="left:${x.o0/D*100}%;width:${(x.o1-x.o0)/D*100}%;background:${segCol(x.seg)}"></span>`).join('');
  const sc=document.getElementById('dsscrub'); const seek=e=>{const rr=sc.getBoundingClientRect(); DS.t=Math.max(0,Math.min(D-.05,(e.clientX-rr.left)/rr.width*D)); dsDraw(true);};
  sc.onpointerdown=e=>{sc.setPointerCapture(e.pointerId);seek(e);sc.onpointermove=seek;}; sc.onpointerup=()=>sc.onpointermove=null;
  let drag=null;
  fr.onpointerdown=e=>{ const m=outToMaster(DS.EL,DS.t), cur=rfOf(DC,fmt,m.seg); fr.setPointerCapture(e.pointerId);
    let fx=.5,fy=.5; if(cur.mode==='track'||cur.mode==='extend'){ const p=trackAt(DC,m.time); fx=p.x; fy=p.y; } else if(cur.mode==='manual'){ fx=cur.fx; fy=cur.fy; }
    drag={x:e.clientX,y:e.clientY,fx,fy,seg:m.seg,moved:false}; if(DS.playing) dsStop(); };
  fr.onpointermove=e=>{ if(!drag) return; const k=1.4; const fx=Math.max(0,Math.min(1,drag.fx-(e.clientX-drag.x)/w/k)), fy=Math.max(0,Math.min(1,drag.fy-(e.clientY-drag.y)/h/k));
    if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<4) return; drag.moved=true;
    fmt.rf[drag.seg]={mode:'manual',fx,fy,auto:false}; dsDraw(true); };
  fr.onpointerup=()=>{ if(drag&&drag.moved){ fmt.rfDirty=true; DS.curSeg=drag.seg; toast(`✋ Plan recadré à la main — validez le cadrage en V${fmt.rfVer+1} quand c’est bon`); if(DS.panel==='cadrage') refreshPanel(); refreshFormatChips(); } drag=null; };
  cacheFrames(DC).then(()=>{ dsDraw(true); paintRfThumbs(); });
  if(!DC.track) analyzeMaster(DC,p=>{ const b=document.getElementById('anap'); if(b) b.textContent=Math.round(p*100)+'%'; const bar=document.querySelector('.dsp .bar i'); if(bar&&DS.panel==='cadrage') bar.style.width=p*100+'%'; }).then(()=>{ if(!DS) return; const b=document.getElementById('anabadge'); if(b) b.remove(); toast('🔍 Analyse terminée — cadrages choisis automatiquement',I.check); if(DS.panel==='cadrage') refreshPanel(); dsDraw(true); });
};
function refreshPanel(){ const el=document.querySelector('.dsp'); if(!el) return; const sc=el.scrollTop; el.innerHTML=panelHtml(); el.scrollTop=sc; paintRfThumbs(); }
function refreshFormatChips(){ if(!DS) return; const fmt=fmtOf(DS.DC,DS.DC.sel.f); const chip=document.querySelector(`.dsprev [data-act=dsSel][data-k=f][data-v="${fmt.k}"]`); if(chip&&fmt.rfDirty&&!chip.innerHTML.includes('●')) chip.insertAdjacentHTML('beforeend','<span style="color:var(--warn)">●</span>'); }
dsDraw=function(seek){
  if(!DS||DS.mode!=='edit') return; const cv=document.getElementById('dscv'); if(!cv) return; const {DC}=DS, cfg=DC.sel, v=masterVideo();
  const m=outToMaster(DS.EL,DS.t); let src=null;
  if(DS.playing){ if(Math.abs(v.currentTime-m.time)>.25) v.currentTime=m.time; src=v.readyState>=2?v:frameFor(DC,cfg,DS.t); }
  else { src=frameFor(DC,cfg,DS.t); if(seek){ clearTimeout(DS.sk); DS.sk=setTimeout(()=>seekTo(v,m.time).then(()=>{ if(DS&&!DS.playing){ drawFrame(cv.getContext('2d'),cv.width,cv.height,DC,cfg,DS.t,v,true); } }),60); } }
  drawFrame(cv.getContext('2d'),cv.width,cv.height,DC,cfg,DS.t,src,true);
  const pc=DS.t/DS.D*100; document.getElementById('dspr').style.width=pc+'%'; document.getElementById('dshd').style.left=pc+'%'; document.getElementById('dstc').textContent=fmtS(DS.t)+' / '+fmtS(DS.D);
  if(DS.panel==='cadrage'&&DS.curSeg!==m.seg){ DS.curSeg=m.seg; document.querySelectorAll('.rfcard').forEach(c=>c.classList.toggle('cur',c.dataset.s===m.seg)); }

/* ---------- image de démonstration (simule le modèle) ---------- */
function genArt(seed,w,h,model){
  const r=rng(seed*131+17), c=document.createElement('canvas'); c.width=w*2; c.height=h*2; const x=c.getContext('2d'); w*=2; h*=2;
  const p=PAL[Math.floor(r()*PAL.length)], q=PAL[Math.floor(r()*PAL.length)];

  const s=Math.min(w,h)*(.5+r()*.15); drawProduct(x,w*(.38+r()*.24),hz-s*.1,s,Math.floor(r()*4),p[1],p[2]);
  if(model==='sdxl'){ const v=x.createRadialGradient(w/2,h/2,Math.min(w,h)*.3,w/2,h/2,Math.max(w,h)*.75); v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.45)'); x.fillStyle=v; x.fillRect(0,0,w,h); }
  const l=x.createLinearGradient(0,0,w,h); l.addColorStop(0,'rgba(255,255,255,.12)'); l.addColorStop(.5,'rgba(255,255,255,0)'); x.fillStyle=l; x.fillRect(0,0,w,h);

}
function loadImg(src){ return new Promise(r=>{ const i=new Image(); i.onload=()=>r(i); i.onerror=()=>r(null); i.src=src; }); }

  const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  const draw=(img,sc,dx,dy,rot,alpha)=>{ const s=Math.max(W/img.width,H/img.height)*sc; x.save(); x.globalAlpha=alpha; x.translate(W/2+dx*W,H/2+dy*H); x.rotate(rot); x.drawImage(img,-img.width*s/2,-img.height*s/2,img.width*s,img.height*s); x.restore(); };

    if(move==='push') sc=1+.28*e; else if(move==='pull') sc=1.28-.28*e; else if(move==='pan'){ sc=1.22; dx=-.08+.16*e; } else if(move==='orbit'){ sc=1.18; dx=Math.sin(e*Math.PI)*.06-.03+.06*e; rot=(e-.5)*.05; } else { sc=1.04+.02*Math.sin(u*Math.PI); }

    const sw=x.createLinearGradient(W*(u*1.6-.4),0,W*(u*1.6-.1),H); sw.addColorStop(0,'rgba(255,255,255,0)'); sw.addColorStop(.5,'rgba(255,255,255,.10)'); sw.addColorStop(1,'rgba(255,255,255,0)'); x.fillStyle=sw; x.fillRect(0,0,W,H); };

<script>
/* ---- Lien avec l'appli fusionnée : résumé des projets DAM partagé (m/dam/projects) ---- */
(function(){
  "use strict";
  let last="", db=null, ok=false;
  const sum=()=>S.projects.map(p=>{const c=client(p.clientId)||{};const ph=p.phases||[];const n=p.assets.length;
    return {id:p.id,name:p.name,client:c.name||"",phase:(ph[p.cur]||{}).name||"",closed:!!p.closed,
      from:ph[0]?ph[0].start.slice(0,10):"",to:ph.length?ph[ph.length-1].end.slice(0,10):"",
      phases:ph.map(x=>({name:x.name,start:x.start.slice(0,10),end:x.end.slice(0,10)})),
      assets:n,validated:p.assets.filter(a=>a.status==='validated').length,
      todo:p.assets.reduce((k,a)=>k+a.annotations.filter(x=>!x.done).length+(a.type==='ecom'?a.items.filter(i=>i.st==='retouche').length:0),0),
      demo:true};});
  async function push(){
    if(!ok) return; const L=sum(), j=JSON.stringify(L); if(j===last) return; last=j;
    for(const p of L){ try{ await db.doc("m/dam/projects/"+p.id).set({...p,updated:new Date().toISOString()}); }catch(e){} }
  }
  (async()=>{
    if(!window.CORE) return;
    try{ db=await CORE.use("db"); ok=!!db && await CORE.isAdmin(); }catch(e){ ok=false; }
    if(!ok) return; push(); setInterval(push,4000);
  })();
})();
</script>
